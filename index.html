<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO 2301 Mega Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FAFBF7; --surface2:#E3E8E0; --ink:#17202A; --ink2:#4B5663; --ink3:#77818C;
  --line:#CAD2C7; --grid:rgba(23,32,42,.055);
  --k:#5E4396; --k-soft:#E6DFF2; --k-ink:#FFFFFF;
  --na:#B86A00; --na-soft:#F8E8C9;
  --good:#23734A; --good-soft:#DAEEE1; --bad:#B3342A; --bad-soft:#F5DDD9;
  --shadow:0 1px 0 rgba(23,32,42,.04), 0 8px 24px -16px rgba(23,32,42,.25);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131A; --surface:#171B24; --surface2:#1F2531; --ink:#E6E9EE; --ink2:#A4ADBA; --ink3:#7A8494;
    --line:#2B3240; --grid:rgba(230,233,238,.045);
    --k:#B49EE6; --k-soft:#272040; --k-ink:#14101F;
    --na:#F0AD45; --na-soft:#3A2B12;
    --good:#5CC48B; --good-soft:#15301F; --bad:#F07B6F; --bad-soft:#3A1B18;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131A; --surface:#171B24; --surface2:#1F2531; --ink:#E6E9EE; --ink2:#A4ADBA; --ink3:#7A8494;
  --line:#2B3240; --grid:rgba(230,233,238,.045);
  --k:#B49EE6; --k-soft:#272040; --k-ink:#14101F;
  --na:#F0AD45; --na-soft:#3A2B12;
  --good:#5CC48B; --good-soft:#15301F; --bad:#F07B6F; --bad-soft:#3A1B18;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:20px 120px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible, label:focus-within{outline:2px solid var(--k); outline-offset:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}

/* header */
.mast{display:grid; grid-template-columns:1fr; gap:8px; padding-block:8px 20px}
.mast h1{font-family:var(--display); font-weight:800; font-size:clamp(52px,11vw,104px); line-height:.86; letter-spacing:.005em; margin:0; text-transform:uppercase; text-wrap:balance}
.mast h1 span{color:var(--k)}
.mast p{margin:0; color:var(--ink2); max-width:60ch}
.trace{width:100%; height:auto; display:block; margin-top:10px; overflow:visible}
.trace .ax{stroke:var(--line); stroke-width:1}
.trace .th{stroke:var(--na); stroke-width:1; stroke-dasharray:4 4}
.trace .ln{fill:none; stroke:var(--k); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.trace text{font-family:var(--mono); font-size:11px; fill:var(--ink3)}
.trace .thl{fill:var(--na)}
@media (prefers-reduced-motion:no-preference){
  .trace .ln{stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 1.6s ease-out .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}

/* tabs */
.tabs{display:flex; gap:4px; padding:4px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; margin-block:4px 16px; width:max-content; max-width:100%}
.tab{border:0; background:transparent; border-radius:9px; padding:10px 18px; min-height:44px; font-weight:700; color:var(--ink2)}
.tab.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.tab .ct{font-family:var(--mono); font-weight:500; font-size:12px; opacity:.7; margin-left:6px}

/* summary strip */
.strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-block:8px 16px}
.stat{background:var(--surface); padding:14px 16px}
.stat b{display:block; font-family:var(--display); font-weight:800; font-size:36px; line-height:1}
.stat small{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.actions{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 16px; font-weight:700; min-height:46px; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--k); border-color:var(--k); color:var(--k-ink)}
.btn.na{background:var(--na-soft); border-color:transparent; color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn .ct{font-family:var(--mono); font-weight:500; font-size:12px; opacity:.8}

details.watch{background:var(--na-soft); border-radius:14px; padding:4px 16px; margin-block:4px 24px}
details.watch summary{cursor:pointer; font-weight:700; padding:10px 0; list-style:none; display:flex; justify-content:space-between; gap:12px}
details.watch summary::-webkit-details-marker{display:none}
details.watch summary::after{content:"+"; font-family:var(--mono)}
details.watch[open] summary::after{content:"−"}
.watch ul{margin:0 0 12px; padding:0; list-style:none; display:grid; gap:10px}
.watch li b{display:block}
.watch li span{color:var(--ink2)}

/* units */
.unit{margin-top:28px}
.unit-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:12px}
.unit-h h2{font-family:var(--display); font-weight:800; font-size:32px; line-height:1; margin:0; text-transform:uppercase}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:12px; box-shadow:var(--shadow)}
.card.sel{border-color:var(--k); box-shadow:0 0 0 2px var(--k)}
.card-top{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.ring{width:54px; height:54px}
.ring circle{fill:none; stroke-width:5}
.ring .bgc{stroke:var(--surface2)}
.ring text{font-family:var(--mono); font-size:13px; font-weight:500; fill:var(--ink)}
.card h3{margin:0; font-size:17px; line-height:1.25}
.meta{font-family:var(--mono); font-size:12px; color:var(--ink3); margin-top:2px}
.pick{display:grid; place-items:center; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); cursor:pointer}
.pick input{width:20px; height:20px; accent-color:var(--k); cursor:pointer}
.card-btns{display:flex; flex-wrap:wrap; gap:6px}
.card-btns .btn{min-height:40px; padding:8px 12px; font-size:14px}
.chip{font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:99px; background:var(--surface2); color:var(--ink2); white-space:nowrap}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.na{background:var(--na-soft); color:var(--na)}

/* selection bar */
.selbar{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -10px 30px -20px rgba(0,0,0,.4); z-index:10}
.selbar .in{max-width:1080px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.selbar .lbl{font-weight:700; margin-right:auto}

/* quiz */
.qtop{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.qtop .ttl{font-family:var(--display); font-weight:800; font-size:28px; line-height:1; text-transform:uppercase; margin-right:auto}
.bar{height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-bottom:18px}
.bar i{display:block; height:100%; background:var(--k); transition:width .25s ease}
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(16px,4vw,28px); box-shadow:var(--shadow); max-width:780px; margin:0 auto}
.qmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.qtext{font-size:clamp(19px,2.6vw,23px); line-height:1.4; font-weight:700; margin:0 0 18px; text-wrap:pretty}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center; text-align:left; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; min-height:58px; font-size:17px; line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--k)}
.opt .key{font-family:var(--mono); font-size:13px; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:var(--surface2); color:var(--ink2)}
.opt.chosen{border-color:var(--k); background:var(--k-soft)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.right .key{background:var(--good); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--surface2)}
.fb b{display:block; margin-bottom:2px}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.qnav{display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap}
.hint{font-family:var(--mono); font-size:12px; color:var(--ink3)}
@media (hover:none){.hint{display:none}}

/* results */
.res{max-width:780px; margin:0 auto; display:grid; gap:16px}
.score{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; box-shadow:var(--shadow)}
.score .big{font-family:var(--display); font-weight:800; font-size:clamp(64px,14vw,112px); line-height:.85}
.score h2{margin:0 0 4px; font-size:20px}
.score p{margin:0; color:var(--ink2)}
.breakdown{display:grid; gap:6px}
.brow{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.miss{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.miss p{margin:0 0 8px; font-weight:700}
.miss .yours{color:var(--bad)} .miss .corr{color:var(--good)}
.miss small{display:block; color:var(--ink2); margin-top:6px}
.sech{font-family:var(--display); font-weight:800; font-size:24px; text-transform:uppercase; margin:8px 0 0}

/* study */
.study{max-width:860px; margin:0 auto}
.search{width:100%; font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); margin-bottom:16px}
.sq{padding:12px 0; border-bottom:1px solid var(--line)}
.sq p{margin:0 0 4px; font-weight:700}
.sq .a{color:var(--k); font-weight:700}
.sq small{display:block; color:var(--ink2)}
.empty{color:var(--ink2); padding:16px 0}

[hidden]{display:none !important}
.tab.ct-tab.on{background:var(--k); color:var(--k-ink)}
.primer .pr, .study .pr{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(14px,3vw,22px); margin-block:14px; box-shadow:var(--shadow)}
.pr h3{font-family:var(--display); font-weight:800; font-size:26px; text-transform:uppercase; margin:0 0 12px; line-height:1}
.pr p{margin:0 0 10px}
.mn{display:grid; gap:2px; border-left:4px solid var(--k); background:var(--k-soft); border-radius:0 10px 10px 0; padding:10px 14px; margin-top:10px}
.mn b{font-size:16px}
.mn span{color:var(--ink2)}
.tblw{overflow-x:auto; margin-inline:-4px}
.tbl{width:100%; border-collapse:collapse; font-size:15px}
.tbl th{text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); padding:6px 8px; border-bottom:2px solid var(--line)}
.tbl td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top}
.dg{width:100%; height:auto; display:block; margin-block:6px 4px; overflow:visible}
.dg .lb{font-family:var(--mono); font-size:13px; fill:var(--ink)}
.dg .lb.sm{font-size:11.5px; fill:var(--ink2)}
.dg .k{fill:var(--k)} .dg .na{fill:var(--na)} .dg .bad{fill:var(--bad)}
.dg .gl{stroke:var(--line); stroke-width:1}
.dg .th{stroke:var(--na); stroke-dasharray:5 5}
.dg .ln{fill:none; stroke:var(--k); stroke-width:3; stroke-linejoin:round}
.dg .ref{fill:var(--bad-soft)} .dg .ref2{fill:var(--na-soft)}
.dg .pt{fill:var(--k)} .dg .pn{fill:var(--k-ink); font-family:var(--mono); font-size:13px; text-anchor:middle; font-weight:500}
.dg .ax{fill:var(--k-soft); stroke:var(--k)}
.dg .term{fill:var(--k-soft); stroke:var(--k); stroke-width:2}
.dg .ves{fill:var(--na-soft); stroke:var(--na); stroke-width:2}
.dg .ch{fill:var(--k)}
.dg .nt{r:4px; fill:var(--na)}
.dg .post{fill:var(--surface2); stroke:var(--line); stroke-width:2}
.dg .psd{fill:var(--k)}
.dg .arr{fill:none; stroke:var(--ink2); stroke-width:2; marker-end:url(#ah)}
.dg path.arr.na{stroke:var(--na)}
.dg .hl{fill:none; stroke:var(--bad); stroke-width:3; stroke-dasharray:6 4}
.dg .nd{fill:var(--surface2); stroke:var(--ink2); stroke-width:2}
.dg circle.nd.k{fill:var(--k)}
.dg .bm{fill:url(#bmg); stroke:var(--ink2); stroke-width:1.5}
.dg .gel{fill:var(--k-soft); stroke:var(--k)}
.dg .oto{fill:var(--na); stroke:var(--surface); stroke-width:1}
.dg .hair{stroke:var(--ink2); stroke-width:2; fill:none}
.dg .hc{fill:var(--surface2); stroke:var(--ink2)}
.dg .cup{fill:var(--k-soft); stroke:var(--k); stroke-width:2}
.dg .eye{fill:var(--surface2); stroke:var(--ink2); stroke-width:2}
.dg .fib{fill:none; stroke-width:4; stroke-linecap:round; opacity:.85}
.dg path.fib.k{stroke:var(--k)} .dg path.fib.na{stroke:var(--na)}
.dg.narrow{max-width:420px; margin-inline:auto}
.dg .chx{fill:var(--surface2); stroke:var(--ink3); stroke-dasharray:4 3}
.dg .x{stroke:var(--bad); stroke-width:6; stroke-linecap:round}
.dg .wv{fill:none; stroke:var(--k); stroke-width:1.6; stroke-linejoin:round}
.dg path.wv.na{stroke:var(--na)} .dg path.wv.bd{stroke:var(--bad)}
.dg .bx{fill:var(--surface2); stroke:var(--ink2); stroke-width:1.5}
.dg rect.bx.k{fill:var(--k-soft); stroke:var(--k)}
.dg .fb{fill:none; stroke:var(--bad); stroke-width:2; stroke-dasharray:6 5; marker-end:url(#ahb)}
.seg{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.sbtn{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; min-height:40px; font-weight:700; font-size:14px}
.sbtn.on{background:var(--k); border-color:var(--k); color:var(--k-ink)}
.stepbox{background:var(--surface2); border-radius:12px; padding:12px 14px; margin-top:6px}
.stepbox p{margin:0}
.flow{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px}
.fs{background:var(--surface2); border-radius:12px; padding:12px; display:grid; gap:6px; position:relative}
.fs b{font-family:var(--display); font-weight:800; font-size:20px; text-transform:uppercase}
.fs span{font-size:14px; color:var(--ink2)}
.tag{font-style:normal; font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:99px; background:var(--surface); white-space:nowrap}
.tag.k{color:var(--k)} .tag.bad{color:var(--bad)} .tag.na{color:var(--na)}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px}
.card2{background:var(--surface2); border-radius:12px; padding:12px}
.card2 h4{margin:0 0 6px; font-size:16px}
.card2 p{margin:0; font-size:15px; color:var(--ink2)}
.scale{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:6px}
.scale div{background:var(--good-soft); border-radius:10px; padding:8px 10px; display:grid}
.scale div.bad{background:var(--bad-soft)}
.scale b{font-family:var(--mono)} .scale span{font-size:13px; color:var(--ink2)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.gc{background:var(--surface2); border-radius:12px; padding:12px; display:grid; gap:2px}
.gc small{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3)}
.gc b{font-family:var(--display); font-weight:800; font-size:26px}
.gc span{font-size:14px; color:var(--ink2)}
.box{width:100%; min-height:140px; font-family:var(--mono); font-size:12px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); margin-bottom:10px}
.hint2{color:var(--bad); margin:0}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:700; opacity:0; pointer-events:none; transition:.2s; z-index:50}
.toast.on{opacity:1; transform:translate(-50%,0)}
</style>

<script>

const CATS={"homeo":{"name":"Homeostasis & the Membrane","q":[["Blood sugar rises after a meal, insulin is released, and blood sugar drops back to normal. What kind of mechanism is this?","Negative feedback",["Positive feedback","Feedforward control","A conditioned reflex"],"The response reversed the original change. Reversal = negative feedback."],["Contractions during childbirth keep getting stronger until the baby is delivered. What kind of mechanism is this?","Positive feedback",["Negative feedback","Set point correction","Receptor desensitization"],"The response amplifies the change and stops only when a specific outcome (delivery) is reached."],["Which two systems regulate and coordinate the body to maintain homeostasis?","Nervous and endocrine",["Nervous and muscular","Endocrine and digestive","Immune and lymphatic"],"The deck names the nervous and endocrine systems as the regulators of homeostasis."],["Most homeostatic control in the body relies on which mechanism?","Negative feedback",["Positive feedback","Voluntary control","Learned reflexes"],"Negative feedback is the default because it keeps variables near their set point."],["Reflexes are generally described as:","Unlearned and involuntary",["Learned and voluntary","Learned and involuntary","Unlearned and voluntary"],"Reflexes are unpremeditated, unlearned and involuntary. Many happen without conscious awareness."],["In a reflex, which component detects the change in the environment?","Receptor",["Effector","Control center","Motor neuron"],"The receptor senses the stimulus. The effector carries out the response."],["In a reflex, which component is the muscle or gland that carries out the response?","Effector",["Receptor","Integrating center","Afferent pathway"],"Effectors are muscles or glands that produce the response."],["Why does the body use positive feedback so rarely?","It amplifies change until an endpoint",["It needs far more ATP than negative","It only runs through the endocrine system","It can only regulate body temperature"],"Positive feedback pushes a change further. It is only safe when there is a built-in finish line."],["Your temperature rises, you start sweating, and your temperature falls. In this loop, sweating is the:","The response that reverses it",["The stimulus that starts it","The set point it defends","The receptor sensing heat"],"Sweating is the effector response that brings temperature back down."],["The fluid mosaic model describes the plasma membrane as:","Proteins floating in a phospholipid bilayer",["A rigid wall of stacked cellulose fibers","A single sheet of cholesterol molecules","Proteins sandwiched between water layers"],"The bilayer is fluid and proteins drift within it like tiles in a mosaic."],["In the phospholipid bilayer, how do the heads and tails behave?","Heads hydrophilic, tails hydrophobic",["Heads hydrophobic, tails hydrophilic","Heads and tails both hydrophilic","Heads and tails both hydrophobic"],"Heads face the water on both sides. Tails hide in the middle, away from water."],["Growth hormone affects a cell by binding to which part of the plasma membrane?","Membrane receptors",["Membrane antigens","Phospholipid tails","Cholesterol molecules"],"Receptors let the membrane bind hormones, neurotransmitters, autocrine and paracrine chemicals."],["ABO and Rh blood typing depends on which feature of the plasma membrane?","Surface antigens",["Carrier proteins","Leak channels","Receptor enzymes"],"Specific membrane antigens are what blood and tissue typing detect."],["What does selectively permeable mean for the plasma membrane?","It controls what enters and leaves",["It lets every molecule pass freely","It blocks all water from crossing","It lets only ions cross the membrane"],"The membrane selects what crosses, which is essential for homeostasis and cell survival.",1],["In the body, water is the:","Solvent",["Solute","Solution","Suspension"],"Water is the body's solvent. Dissolved particles are solutes. Together they make a solution.",1],["A solute that is able to cross the membrane is called a:","Penetrating solute",["Nonpenetrating solute","Ionizing solute","Nonionizing solute"],"If it can cross, it's penetrating. If it can't, it's nonpenetrating.",1]]},"transport":{"name":"Membrane Transport","q":[["What defines passive transport?","No ATP; moves down the gradient",["Uses ATP; moves down the gradient","No ATP; moves against the gradient","Uses ATP; moves against the gradient"],"Passive transport costs no energy and always runs from high to low concentration.",1],["Which of these is NOT a form of passive transport?","Sodium-potassium pump",["Osmosis","Facilitated diffusion","Filtration"],"The Na+/K+ pump spends ATP, so it's active. The rest are passive.",1],["Side A has 6 Na+ and side B has 2 Na+, and the membrane is permeable to Na+. When does net diffusion stop?","When both sides reach 4",["When side B reaches 6","When side A reaches 0","When both sides reach 8"],"Diffusion runs until equilibrium: the total (8) splits evenly, 4 and 4.",1],["Which setup diffuses faster?","Side A 6, side B 2",["Side A 6, side B 5","Both at the same rate","Neither will diffuse"],"A bigger concentration difference (steeper gradient) means a faster rate.",1],["Sodium and glucose face the same concentration gradient. Which diffuses faster?","Sodium, because it's smaller",["Glucose, because it's larger","Both at exactly the same rate","Glucose, because it holds energy"],"Smaller, lighter particles diffuse faster.",1],["Which change would SLOW the rate of diffusion?","A larger molecule size",["A steeper gradient","More open channels","Higher lipid solubility"],"Size, gradient, solubility and channel/carrier number all set the rate. Bigger = slower."],["Why does glucose need protein carriers (facilitated diffusion) to cross the membrane?","It is too large to cross on its own",["It must move against its gradient","It needs ATP to enter the cell","It is repelled by the lipid tails"],"Glucose is a larger molecule, so carriers help it through. It still moves down its gradient.",1],["In facilitated diffusion, what happens if the membrane has more carriers?","Diffusion speeds up",["Diffusion slows down","Diffusion stops","Diffusion reverses"],"More carriers means more glucose can cross at once.",1],["What is the key difference between facilitated diffusion and active transport?","Active moves uphill using ATP",["Active uses no carrier protein","Facilitated moves uphill using ATP","Facilitated only moves water"],"Both use carrier proteins. Active transport goes against the gradient and costs ATP."],["What does one cycle of the sodium-potassium pump move?","3 Na+ out and 2 K+ in",["2 Na+ out and 3 K+ in","3 K+ out and 2 Na+ in","2 K+ out and 3 Na+ in"],"Three sodium leave, two potassium enter, one ATP spent.",1],["The sodium-potassium pump maintains which distribution?","High Na+ outside, high K+ inside",["High Na+ inside, high K+ outside","High Na+ and K+ both inside","Equal Na+ and K+ everywhere"],"Sodium is kept outside and potassium inside. Everything in the nerve unit depends on this."],["What is the first step of the sodium-potassium pump cycle?","Cytoplasmic Na+ binds the pump",["Extracellular K+ binds the pump","The phosphate group is released","K+ is released into the cell"],"Na+ binding from inside stimulates phosphorylation by ATP, which starts the cycle."],["What causes the pump protein to change shape and expel Na+?","Phosphorylation by ATP",["Binding of glucose","Release of potassium","Water pressure on the cell"],"ATP adds a phosphate, the protein changes shape, and Na+ is pushed outside."],["Exocytosis is best described as:","Vesicles releasing large materials out",["Channels letting small ions flow in","Water leaving the cell by osmosis","Carriers bringing glucose into cells"],"A vesicle fuses with the plasma membrane and spills its contents outside."],["When you have a cold, your cells release mucus using:","Exocytosis",["Endocytosis","Osmosis","Filtration"],"The deck's example: mucus is packaged in vesicles and released by exocytosis."],["Bulk transport (like exocytosis) is classified as:","Active transport",["Passive transport","Simple diffusion","Osmosis"],"Moving vesicles takes energy, so bulk transport is active.",1],["A poison disables every Na+/K+ pump in a neuron. What happens over time?","Gradients run down; it can't fire",["Sodium piles up outside the cell","Leak channels hold the gradients","The cell bursts within seconds"],"Leak channels slowly erase the gradients. Only the pump restores them."],["Filtration is classified as which type of transport?","Passive",["Active","Bulk","Pump-driven"],"Filtration uses pressure, not ATP, so it's passive.",1]]},"osmo":{"name":"Osmosis, Osmolarity & Tonicity","q":[["Osmosis is the movement of:","Water across a membrane",["Solutes across a membrane","Ions through membrane pumps","Proteins through channels"],"Osmosis is water following its own concentration gradient."],["During osmosis, water moves toward the side with:","More solute",["Less solute","More ATP","Lower pressure"],"Water moves toward the higher solute concentration."],["The membrane is NOT permeable to a solute. How is equilibrium reached?","Water moves across",["The solute moves across","Pumps move the solute","Nothing moves at all"],"If solutes can't move, water does the moving instead. That's osmosis.",1],["A 1 M solution of NaCl has an osmolarity of:","2 Osm",["1 Osm","3 Osm","0.5 Osm"],"NaCl splits into Na+ and Cl-, two particles."],["A 1 M solution of MgCl2 has an osmolarity of:","3 Osm",["2 Osm","1 Osm","4 Osm"],"MgCl2 splits into Mg2+ + 2 Cl-, three particles."],["A 1 M solution of glucose has an osmolarity of:","1 Osm",["2 Osm","3 Osm","0.5 Osm"],"Glucose doesn't ionize. It stays one particle."],["Why does NaCl count double in osmolarity compared to glucose?","It splits into two particles",["Its molecules weigh twice as much","It carries a double electric charge","It pulls water from both sides"],"Osmolarity counts dissolved particles, not molecules."],["Which of these is an ionizing solute?","Sodium chloride",["Glucose (C6H12O6)","Sucrose (table sugar)","Urea (CO(NH2)2)"],"Salts, acids and bases ionize. Sucrose, glucose and urea do not."],["The normal osmolarity inside a cell is about:","0.3 Osm (300 mOsm)",["0.1 Osm (100 mOsm)","0.6 Osm (600 mOsm)","3.0 Osm (3000 mOsm)"],"300 mOsm = 0.3 Osm is the body's normal value.",1],["A cell at 0.3 Osm is placed in a 0.1 Osm solution. What happens?","It swells and may lyse",["It shrinks and crenates","Nothing changes at all","It pumps out solutes"],"More solute inside, so water rushes in.",1],["A cell at 0.3 Osm is placed in a 0.1 Osm solution. That solution is:","Hypotonic",["Hypertonic","Isotonic","Hyperosmolar"],"Lower solute outside = hypotonic (hypoosmolar).",1],["A cell at 0.3 Osm is placed in a 0.6 Osm solution. What happens?","Water leaves and it crenates",["Water enters and it lyses","No net water movement","Solutes enter and it swells"],"More solute outside pulls water out, so the cell shrinks (crenates). Hypertonic.",1],["Crenation means the cell:","Shrinks",["Bursts","Swells","Divides"],"Crenate = shrivel. Lyse = burst."],["A cell at 0.3 Osm is placed in a 0.3 Osm solution. The solution is:","Isotonic",["Hypotonic","Hypertonic","Hypoosmolar"],"Same osmolarity on both sides = no net water movement.",1],["Tonicity describes:","A solution's effect on cell volume",["The total particle count in solution","How fast ions diffuse across","ATP used by membrane pumps"],"Tonicity is the effect osmolarity has on the cell's membrane tone via water movement."],["About what is 0.15 M NaCl relative to a normal cell?","Isotonic",["Hypotonic","Hypertonic","Pure water"],"0.15 M × 2 particles = 0.3 Osm, the same as the cell."],["In a hypotonic solution, where are solutes more concentrated?","Inside the cell",["Outside the cell","Equal on both sides","Inside the membrane"],"Hypotonic outside means the cell holds more solutes, so water flows in.",1],["When water moves into or out of a cell, it exerts:","Pressure on the membrane",["Charge on the membrane","Heat on the membrane","No force at all"],"The deck: water movement exerts a pressure on the membrane. That's the basis of tonicity."]]},"org":{"name":"Nervous System Organization","q":[["What are the nervous system's three functions, in order?","Sensory input, integration, motor output",["Integration, sensory input, motor output","Motor output, integration, sensory input","Sensory input, motor output, integration"],"Sense the change, process it, respond."],["The central nervous system consists of:","Brain and spinal cord",["Brain and cranial nerves","Spinal cord and spinal nerves","Cranial and spinal nerves"],"CNS = brain + spinal cord. Everything else is PNS.",1],["The peripheral nervous system consists of:","Cranial and spinal nerves",["Brain and spinal cord","Spinal cord and brainstem","Brainstem and cerebrum"],"PNS is everything outside the brain and spinal cord.",1],["Afferent (sensory) nerves carry signals:","From receptors to the CNS",["From the CNS to effectors","Between the two hemispheres","Only within the spinal cord"],"Afferent = arriving at the CNS.",1],["Efferent (motor) nerves carry signals:","From the CNS to effectors",["From receptors to the CNS","Between two interneurons","From glands to the brain"],"Efferent = exiting the CNS.",1],["Somatic motor nerves signal which tissue?","Skeletal muscle",["Cardiac muscle","Smooth muscle","Glands"],"Somatic = skeletal muscle, voluntary.",1],["Autonomic motor nerves signal which tissues?","Cardiac, smooth muscle, and glands",["Skeletal muscle only","Skeletal and cardiac muscle","Skin, joints, and special senses"],"Autonomic = involuntary targets.",1],["The sympathetic division is known as:","Fight or flight",["Rest and digest","Voluntary movement","Sensory integration"],"Sympathetic ramps the body up for stress.",1],["The parasympathetic division is known as:","Rest and digest",["Fight or flight","Voluntary movement","Pain perception"],"Parasympathetic calms the body down.",1],["Signals from the skin, muscles, joints, and special senses travel on:","Somatic sensory nerves",["Visceral sensory nerves","Autonomic motor nerves","Somatic motor nerves"],"Somatic sensory = from the body wall and special senses."],["Signals from internal body organs travel on:","Visceral sensory nerves",["Somatic sensory nerves","Somatic motor nerves","Parasympathetic nerves"],"Visceral = organs."],["Which of these divisions is under voluntary control?","Somatic motor",["Sympathetic","Parasympathetic","Visceral sensory"],"Only somatic motor output (to skeletal muscle) is voluntary."],["Effector organs are:","Muscles and glands",["Receptors and nerves","Brain and spinal cord","Dendrites and axons"],"Motor output activates effectors: muscles or glands."],["A loud bang makes your heart race. Which division drives the racing heart?","Sympathetic",["Parasympathetic","Somatic motor","Visceral sensory"],"Heart = autonomic. Racing = fight or flight = sympathetic."],["After a big meal your digestion speeds up and heart rate slows. Which division is in charge?","Parasympathetic",["Sympathetic","Somatic motor","Somatic sensory"],"Rest and digest."]]},"neuron":{"name":"Neurons, Glia & Regeneration","q":[["Dendrites carry signals:","Toward the cell body",["Away from the cell body","Between two axons","Into the synaptic cleft"],"Dendrites receive. Axons send."],["The axon carries signals:","Away from the cell body",["Toward the cell body","Into the dendrites","Around the cell body"],"The axon is the single long conducting fiber that sends impulses away.",1],["The axon hillock is:","Where the axon arises and APs start",["Where neurotransmitter is stored","Where dendrites receive input","The gap between myelin segments"],"The cone-shaped region of the cell body where the axon begins and APs are triggered.",1],["What is the job of the axon terminals?","Store and release neurotransmitter",["Generate graded potentials","House the nucleus and organelles","Insulate the axon"],"Terminals hold vesicles full of neurotransmitter.",1],["The signals conducted along dendrites are:","Graded potentials",["Action potentials","Saltatory impulses","Refractory spikes"],"Dendrites carry graded potentials, which can be excitatory or inhibitory."],["Which three traits describe neurons?","Long-lived, amitotic, high metabolism",["Short-lived, mitotic, low metabolism","Long-lived, mitotic, low metabolism","Short-lived, amitotic, high metabolism"],"They live as long as you do, don't divide, and burn a lot of energy."],["Shortly after birth, neurons enter which phase of the cell cycle?","G0",["G1","S","M"],"G0 = out of the cycle. That's why neurons are amitotic."],["Which cells form the myelin sheath in the PNS?","Schwann cells",["Oligodendrocytes","Astrocytes","Microglia"],"PNS = Schwann. CNS = oligodendrocytes."],["Which cells form the myelin sheath in the CNS?","Oligodendrocytes",["Schwann cells","Satellite cells","Microglia"],"CNS myelin comes from oligodendrocytes."],["The gaps between segments of myelin are called:","Nodes of Ranvier",["Axon hillocks","Synaptic clefts","Telodendria"],"The AP jumps from node to node."],["A sensory neuron carries impulses:","From a receptor to the CNS",["From the CNS to an effector","Only within the CNS","From a gland to a muscle"],"Sensory = afferent."],["An interneuron:","Links sensory to motor within the CNS",["Carries receptor signals to the CNS","Carries CNS signals to a muscle","Carries gland signals to the CNS"],"Interneurons receive info in the CNS and pass it to motor neurons."],["How do neuroglia compare to neurons in number?","They outnumber neurons about 9 to 1",["They outnumber neurons about 2 to 1","They equal neurons in number","Neurons outnumber them 9 to 1"],"Glia make up about half the brain's mass and outnumber neurons 9:1."],["How many types of neuroglia are there, and where?","Six: 4 in the CNS, 2 in the PNS",["Four: 2 in the CNS, 2 in the PNS","Six: 3 in the CNS, 3 in the PNS","Eight: 4 in the CNS, 4 in the PNS"],"Six types total, four central and two peripheral."],["Wallerian degeneration is:","The distal axon breaking down after a cut",["The proximal stump growing a new cone","Myelin re-forming around a regrown axon","A glial scar sealing off a CNS injury"],"After a cut, everything distal to the injury degenerates and is cleaned up."],["After a PNS axon is cut, which cells clean up the debris?","Schwann cells and macrophages",["Oligodendrocytes and astrocytes","Microglia and ependymal cells","Satellite cells and neurons"],"Schwann cells and macrophages phagocytize the broken axon and myelin."],["A regenerating PNS axon grows at about:","1 mm per day",["1 cm per day","1 mm per hour","1 cm per week"],"The growth cone creeps along at roughly 1 mm/day."],["How do Schwann cells help a cut PNS axon regrow?","Form guide cords and release NGF",["Form a glial scar over the gap","Release growth-blocking proteins","Divide into new neurons"],"They build a path for the sprout and release nerve growth factor."],["Why does CNS regeneration mostly fail?","A glial scar and inhibitory myelin",["Schwann cells crowd in too fast","Neurons divide out of control","CNS axons have no cell body"],"Dead oligodendrocytes are replaced by a scar, and nearby myelin inhibits growth."],["A PNS axon is cut very close to the cell body. What's the likely outcome?","The whole neuron may die",["The axon regrows even faster","Only the myelin is affected","The dendrites take over"],"Damage near the cell body can kill the entire neuron."],["The profuse branches at the end of an axon are called:","Telodendria",["Dendrites","Nodes of Ranvier","Axon hillocks"],"Telodendria end in the bulb-shaped boutons (terminals)."]]},"rmp":{"name":"Resting Membrane Potential","q":[["What is the resting membrane potential of a neuron?","−70 mV",["−55 mV","+30 mV","0 mV"],"At rest, the inside is 70 mV more negative than the outside.",1],["At rest, how are Na+ and K+ distributed?","More K+ inside, more Na+ outside",["More Na+ inside, more K+ outside","Equal Na+ and K+ on both sides","More Cl- inside, more K+ outside"],"Potassium inside, sodium outside.",1],["The main solutes in the extracellular fluid are:","Sodium and chloride",["Potassium and proteins","Calcium and phosphate","Glucose and urea"],"ECF is salty: Na+ and Cl-. ICF holds K+ and negative proteins."],["Why is the inside of a resting neuron negative?","K+ leaks out and anion proteins stay in",["Na+ leaks in faster than K+ leaks out","Chloride is pumped into the cell","Calcium floods the cytoplasm"],"More positive charge leaves (K+) than enters (Na+), and trapped proteins are negative.",1],["At rest, how permeable is the membrane to Na+ and K+?","Freely to K+, slightly to Na+",["Freely to Na+, slightly to K+","Equally to Na+ and K+","Not permeable to either one"],"K+ leaks out faster than Na+ leaks in."],["Potassium leak channels are:","Always open",["Open only at threshold","Open only with a ligand","Open only when repolarizing"],"Leak (passive) channels are always open."],["What role does the Na+/K+ pump play in the RMP?","It sets up and maintains the gradients",["It generates the action potential spike","It opens the voltage-gated channels","It releases neurotransmitter"],"The pump moves back exactly what leaks and actually establishes the gradients."],["A neuron at rest, with charge separated across the membrane, is described as:","Polarized",["Depolarized","Repolarized","Hyperpolarized"],"Resting = polarized.",1],["Ligand-gated channels open in response to:","A chemical binding",["A voltage change","Mechanical stretch","A temperature change"],"Ligand = chemical, like a neurotransmitter.",1],["Where are ligand-gated channels mainly found on a neuron?","Dendrites and cell body",["Along the axon","At the nodes of Ranvier","Inside the myelin"],"Chemical signals arrive at the dendrites and cell body.",1],["Where are voltage-gated channels mainly found on a neuron?","Along the axon",["Only on the dendrites","Only on the cell body","Only in glial cells"],"Voltage-gated Na+ channels start at the axon hillock and run down the axon.",1],["Ions moving along an electrical gradient move toward:","Opposite charge",["Like charge","Higher concentration","Lower temperature"],"Chemical gradient = high to low concentration. Electrical = toward opposite charge."],["Membrane potential is measured in:","Millivolts",["Milligrams","Milliosmoles","Millimeters"],"Electrical potential is in volts or millivolts."],["In a resting neuron, the two gates of a voltage-gated Na+ channel are:","Activation closed, inactivation open",["Activation open, inactivation closed","Both gates open","Both gates closed"],"At rest the activation gate is shut but the inactivation gate is ready."],["An electrochemical gradient combines differences in:","Concentration and charge",["Pressure and temperature","ATP and ADP levels","Solvent and solute volume"],"Ions follow both their concentration gradient and the electrical pull."],["Which statement about the RMP is true?","Every signal depends on it",["It only exists in muscle","It is positive inside","Chloride pumps create it"],"No RMP, no graded potential, no action potential."]]},"ap":{"name":"Graded & Action Potentials","q":[["A graded potential is:","Local, brief, and fades with distance",["Carried the full axon without fading","All-or-none once it hits threshold","Found only at the axon terminals"],"Graded potentials are decremental and travel only short distances."],["Depolarization means the membrane potential becomes:","More positive",["More negative","Exactly zero","Stuck at rest"],"Toward positive = depolarization."],["Hyperpolarization means the membrane potential becomes:","More negative than rest",["More positive than rest","Exactly −55 mV","Exactly +30 mV"],"Toward negative (below −70) = hyperpolarization."],["What is threshold for firing an action potential?","−55 mV",["−70 mV","+30 mV","−90 mV"],"At −55 mV, voltage-gated Na+ channels open at the axon hillock.",1],["How much does a graded potential need to depolarize the membrane to reach threshold?","About 15 to 20 mV",["About 2 to 5 mV","About 70 mV","About 100 mV"],"−70 to −55 is 15 mV. The deck rounds it to 20 mV or more."],["What is the peak voltage of an action potential?","+30 mV",["0 mV","−55 mV","+70 mV"],"The membrane swings from −70 all the way to +30.",1],["Which ion movement drives the depolarization phase?","Na+ rushing in",["K+ rushing out","Cl- rushing in","Ca2+ rushing out"],"Na+ gates open, K+ gates stay closed.",1],["Which ion movement drives the repolarization phase?","K+ rushing out",["Na+ rushing in","Cl- rushing out","Ca2+ rushing in"],"At +30, voltage-gated K+ channels open and potassium leaves.",1],["Why is there a brief hyperpolarization (undershoot) after repolarization?","K+ gates close slowly",["Na+ gates reopen","The pump shuts off","Cl- floods the cell"],"Potassium keeps leaving a little too long."],["Which is the positive feedback loop inside an action potential?","Na+ entry opens more Na+ channels",["K+ exit closes the Na+ channels","The pump restores the gradients","Refractory periods block firing"],"Sodium entry depolarizes, which opens more channels, which lets in more sodium."],["All-or-none means:","At threshold, a full AP fires",["AP size matches stimulus size","Every stimulus causes an AP","The AP fades with distance"],"Below threshold nothing fires. At threshold the full AP fires every time."],["What is the correct order of AP phases?","Rest, depolarize, repolarize, hyperpolarize",["Rest, repolarize, depolarize, hyperpolarize","Depolarize, rest, hyperpolarize, repolarize","Rest, hyperpolarize, depolarize, repolarize"],"1 rest, 2 depolarization, 3 repolarization, 4 hyperpolarization."],["Summation can occur with:","Graded potentials",["Action potentials","Refractory periods","Myelin segments"],"Graded potentials can add up if they arrive before the previous one dies away."],["Where is an action potential generated?","At the axon hillock",["At the dendrite tips","At the axon terminal","In the synaptic cleft"],"The hillock is the trigger zone."],["The rapid Na+ phase of an action potential lasts about:","1 millisecond",["1 second","10 seconds","1 minute"],"The explosive rising phase lasts about 1 ms."],["What does the Na+ channel's inactivation gate do?","Shuts Na+ out right after opening",["Lets Na+ leak in during rest","Pumps Na+ back out of the cell","Holds K+ inside the axon"],"It shuts sodium entry down right after it starts."],["Why does an action potential travel in only one direction?","The area behind it is refractory",["Dendrites block backward flow","K+ channels sit on one side only","Myelin is thicker at one end"],"Na+ gates close behind the impulse, so it can only move forward."],["During the absolute refractory period:","No stimulus can trigger an AP",["A strong stimulus can trigger one","The cell is fully at rest","The cell sits exactly at threshold"],"The Na+ channels are inactivated. Nothing gets through."],["During the relative refractory period:","Only a stronger stimulus fires one",["No stimulus can trigger an AP","Any normal stimulus will fire one","The pump must finish its cycle"],"The membrane is hyperpolarized, so it takes extra to reach threshold."],["What do refractory periods do overall?","Cap APs per unit time",["Speed up conduction","Make each AP stronger","Allow backward travel"],"They cap the firing rate."],["Saltatory conduction means:","The impulse jumps node to node",["The impulse regenerates everywhere","The impulse travels backward","The impulse skips the axon hillock"],"Myelin forces current to cross only at the nodes."],["In a myelinated axon, voltage-gated Na+ channels are concentrated:","At the nodes of Ranvier",["Under the myelin sheath","On the dendrites","Evenly along the axon"],"That's why the AP can only regenerate at the nodes."],["Which fibers conduct fastest aring."],["Why is there no sound in a vacuum?","There are no molecules to vibrate",["Sound travels too fast to hear","The pressure is too high","Light cancels out the waves"],"Sound is molecules being set into vibration."],["Pitch discrimination is mainly due to:","Basilar membrane shape",["The size of the pinna","The eustachian tube","The number of ossicles"],"Different regions of the membrane respond to different frequencies."],["Which fibers of the basilar membrane respond to high-pitched sounds?","Short fibers near the base",["Long fibers near the base","Short fibers near the apex","Long fibers near the apex"],"Short = high, near the oval window. Long = low, near the apex."],["Loudness is measured on which scale?","Decibels, a logarithmic scale",["Hertz, a linear scale","Decibels, a linear scale","Hertz, a logarithmic scale"],"The range is huge: pin drop to steam whistle is a trillion-fold."],["Hearing loss becomes likely with frequent exposure above:","90 dB",["50 dB","20 dB","200 dB"],"0 to 85 dB causes no hair cell damage."],["Normal conversation is about:","50 dB",["70 dB","120 dB","10 dB"],"A noisy restaurant is 70, a rock concert 120."],["A rock concert is about:","120 dB",["50 dB","70 dB","200 dB"],"The pain threshold is 130 to 140 dB."],["The two factors in noise-induced hearing loss are:","Intensity and duration",["Pitch and ear canal shape","Age and eye color","Earwax and pinna size"],"How loud and for how long."],["How does the ear tell loud sounds from soft ones?","Faster APs, more hair cells, loud-only cells",["Longer fibers, fewer cells, slower APs","Bigger eardrum, more wax, wider canal","More ossicles, a larger cochlea, less fluid"],"Three methods of loudness discrimination."],["What is the correct path of sound?","Pinna, canal, tympanic membrane, ossicles, oval window",["Pinna, ossicles, canal, oval window, tympanic membrane","Canal, oval window, ossicles, tympanic membrane, cochlea","Pinna, tympanic membrane, oval window, ossicles, canal"],"Out m","Fluid in the middle ear"],"Often gradual, or from loud noise tearing the cilia."],["Where is the receptor (graded) potential formed in hearing?","In the hair cells",["In the malleus","In the tympanic membrane","In the auditory cortex"],"The hair cells are the transducers."]]},"balance":{"name":"Equilibrium","q":[["The vestibular system takes input from:","Inner ear, eyes, proprioceptors",["The inner ear, working alone","Vision, working alone","Cochlea, taste, and smell"],"Three sources combine for balance."],["The semicircular canals detect:","Rotation (dynamic equilibrium)",["Linear motion (static equilibrium)","Sound frequency","Head position at rest only"],"They sense angular acceleration."],["The vestibule (utricle and saccule) detects:","Gravity and linear motion",["Rotation of the head","Sound loudness and pitch","Changes in light levels"],"Static equilibrium: up and down, back and forth."],["The maculae are found in the:","Utricle and saccule",["Semicircular canals","Cochlea","Middle ear"],"One in each sac wall."],["Otoliths are made of:","Calcium carbonate crystals",["Sodium chloride crystals","Protein fibers","Cartilage chips"],"Tiny stones on the otolithic membrane."],["The otolithic membrane slides over the hair cells when:","Head starts or stops in a line",["The head spins in a circle","A loud sound enters the ear","Bright light hits the retina"],"Linear acceleration."],["The crista ampullaris is found in:","The ampulla of each canal",["The saccule of the vestibule","The organ of Corti","The tympanic cavity"],"The receptor for rotation."],["The cupula is:","A gel mass over the crista",["A stone layer on the maculae","A membrane over the organ of Corti","The opening of the eustachian tube"],"Fluid pushes the cupula, which bends the hair cells."],["Vestibular hair cells have:","Many stereocilia and one kinocilium",["One stereocilium and many kinocilia","Only kinocilia","Only microvilli"],"The single kinocilium is a true cilium."],["Balance signals travel on the:","Vestibular branch of CN VIII",["Cochlear branch of CN VIII","Oculomotor nerve (CN III)","Trigeminal nerve (CN V)"],"Vestibulocochlear nerve, vestibular branch."],["Vestibular nystagmus is:","Eye drifting and jumping with rotation",["Ringing in the ears after noise","Loss of balance from middle ear fluid","Pupil dilation during spinning"],"The eyes drift opposite the spin, then jump."],["Why do you feel vertigo right after you stop spinning?","Canal fluid and eyes keep moving",["Otoliths fall off the membrane","The eustachian tube pops","Hair cells stop firing completely"],"The eyes keep moving after the rotation ends."],["An elevator starting to go up is detected mainly by the:","Maculae",["Crista ampullaris","Organ of Corti","Retina"],"Vertical linear acceleration."],["Spinning in an office chair is detected mainly by the:","Crista ampullaris",["Maculae","Organ of Corti","Tympanic membrane"],"Rotational acceleration."],["Why are there three semicircular canals?","One for each plane of head motion",["One each for pitch, volume, and tone","One each for light, sound, and touch","Two for balance and one for hearing"],"Nodding yes, shaking no, and tilting ear to shoulder."]]},"chem":{"name":"Taste & Smell","q":[["Taste buds are found mainly in projections on the tongue called:","Lingual papillae",["Olfactory hairs","Crista ampullaris","Maculae"],"About 10,000 taste buds, mostly on the tongue."],["Each taste bud contains which three cell types?","Supporting, receptor, and basal cells",["Rods, cones, and ganglion cells","Hair, supporting, and otolith cells","Bipolar, basal, and glial cells"],"40 to 60 epithelial cells per bud."],["Basal cells in a taste bud:","Regenerate the receptor cells",["Detect sweet tastes only","Send impulses to the brain","Secrete saliva"],"They're the replacement crew."],["Taste receptor cells are replaced about every:","7 to 10 days",["7 to 10 months","24 hours","7 to 10 years"],"They shed constantly."],["Taste receptor cells convert chemicals into:","Receptor (graded) potentials",["Action potentials directly","Hormones","Mechanical vibrations"],"Specialized ciliated epithelial cells do the transduction."],["Which is one of the basic taste qualities?","Umami",["Spicy","Cooling","Metallic"],"Savory. Spicy is actually pain."],["Most taste buds respond to:","Two or three taste qualities",["Only one taste quality","All taste qualities equally","No specific quality"],"They aren't one-flavor specialists."],["Saccharin is an example of a substance that:","Tastes sweet, then bitter",["Tastes sour, then salty","Has no taste at all","Tastes only umami"],"Flavor can change as it moves through the mouth."],["Animals instinctively avoid which taste?","Bitter",["Sweet","Salty","Umami"],"Bitter often signals poison."],["About how much of taste is actually smell?","80 percent",["20 percent","50 percent","5 percent"],"Smell complements taste heavily."],["What role does nasal mucus play in smell?","It dissolves odor molecules",["It blocks all odor molecules","It amplifies sound waves","It carries impulses to the brain"],"Odor chemicals must dissolve before receptors detect them."],["Olfactory receptor cells have which structures?","Olfactory hairs (cilia)",["Stereocilia and a kinocilium","Rods and cones","Otoliths"],"Thin dendrites end in a knob with cilia."],["About how many chemicals can we distinguish by smell?","10,000",["100","1,000,000","400,000"],"400,000 is the hearing number."],["Primary odors may be as few as:","7",["2","100","1,000"],"Floral, musky, camphorous, peppermint, pungent, putrid... or up to 30."],["What makes olfaction unique among the senses (per the slides)?","It ends in the limbic system",["It uses no receptors at all","It is carried by CN VIII","It uses rhodopsin to detect odors"],"The deck says it terminates in the limbic system without reaching cortical areas."],["Taste and smell both use which type of receptor?","Chemoreceptors",["Mechanoreceptors","Photoreceptors","Thermoreceptors"],"Both detect dissolved chemicals."]]},"pain":{"name":"Pain","q":[["What is the purpose of pain?","Warn of tissue damage",["Improve fine motor coordination","Regulate body temperature","Speed up muscle recovery"],"It has important protective value."],["Nociceptors are:","Free nerve endings",["Encapsulated receptors","Hair cells","Photoreceptors"],"Bare endings woven through tissues and organs."],["Which stimuli activate nociceptors?","Damaging force, heat, or chemicals",["Light touch and gentle vibration","Sound waves louder than 90 dB","Small changes in blood pressure"],"Mechanical deformation, excess heat, and chemical mediators."],["Bradykinin is:","A potent pain chemical released after damage",["A natural painkiller released by the brain","A neurotransmitter for voluntary movement","A hormone that lowers blood pressure"],"Enzymes release it when tissue is damaged."],["Bradykinin release leads to:","More mediators and more pain",["Immediate numbness of the area","Endorphin release that stops pain","Constriction of nearby vessels"],"It recruits other mediators and fires more receptors."],["Prostaglandins are involved in:","Inflammation, pain, and fever",["Vision, hearing, and balance","Learning and memory","Muscle contraction only"],"Produced when white cells flood a damaged site."],["Lactic acid causes muscle pain because:","Its low pH fires free nerve endings",["It blocks all sodium channels","It releases endorphins into muscle","It raises muscle temperature"],"That's the burn."],["Lactic acid is produced when muscles burn glucose:","Without oxygen",["With extra oxygen","With extra ATP","Without any glucose"],"Anaerobic metabolism."],["The lateral spinothalamic tract is:","Faster and well localized; pain and temp",["Slower and poorly localized; visceral pain","Motor only; voluntary movement","Sensory only; vision"],"The deck's fast, well localized pain pathway."],["According to the slides, the dorsal column system:","Is slower and carries visceral pain",["Is faster and carries temperature","Carries only voluntary motor signals","Carries only visual information"],"Also carries somatic touch and position sense."],["Both pain pathways relay through the:","Thalamus to the parietal lobe",["Cerebellum to the frontal lobe","Brainstem to the occipital lobe","Limbic system only"],"The somatosensory cortex is in the parietal lobe."],["Pain pathways send collaterals to the reticular activating system, which:","Boosts alertness",["Blocks incoming pain","Controls fine movement","Processes color vision"],"That's why pain wakes you up."],["Referred pain is:","Organ pain felt on the body surface",["Pain spreading out from a skin cut","Pain felt only during sleep","Pain blocked by endorphins"],"Classic example: heart pain felt in the left arm."],["How do endorphins reduce pain?","They inhibit pain transmission",["They kill the nociceptors","They block all sensory nerves","They raise prostaglandin levels"],"Natural opiates that reduce perception."],["Acupuncture and acupressure may reduce pain by:","Releasing endorphins",["Blocking sodium channels","Destroying nociceptors","Raising bradykinin levels"],"They tap into the natural opiate pathway."],["An analgesic is a drug that:","Relieves pain but not consciousness",["Removes all sensation in the body","Causes complete unconsciousness","Blocks only the sense of touch"],"Aspirin, acetaminophen, ibuprofen."],["An anesthetic is a drug that:","Causes loss of sensation",["Only lowers a fever","Only reduces inflammation","Increases pain sensitivity"],"In part or all of the body."],["Which of these is an analgesic?","Ibuprofen",["Bradykinin","Substance P","Histamine"],"The other three cause pain."],["Which neuropeptide carries pain signals and is inhibited by endorphins?","Substance P",["Glutamate","Dopamine","Acetylcholine"],"Endorphins inhibit substance P."],["Which of these chemicals stimulates nociceptors?","Histamine",["Endorphin","Enkephalin","Acetaminophen"],"Histamine, bradykinin, cytokines ["The radial pulse rate and the ECG heart rate differ. Why can the ECG read higher?","Some beats are too weak to feel at the wrist",["The ECG counts each heartbeat twice","The pulse counts atrial and ventricular beats","The ECG adds in the breathing rate"],"Every electrical beat shows on the ECG, but a weak beat may not push enough blood to make a palpable pulse."],

"lab2":{"name":"Lab 2 · Diffusion & Osmosis","q":[
["How does the concentration gradient affect the rate of diffusion?","Steeper gradient, faster diffusion",["Steeper gradient, slower diffusion","Gradient has no effect on rate","Diffusion only happens at equilibrium"],"The graph had a positive slope: bigger gradient, faster rate."],
["Do solutes of different masses diffuse at the same rate across the same gradient?","No; heavier solutes diffuse slower",["Yes; mass has no effect at all","No; heavier solutes diffuse faster","Yes; only charge affects the rate"],"At identical gradients, rate fell as molecular size rose."],

["In facilitated diffusion, what sets the rate?","Both the gradient and the number of carriers",["Only the concentration gradient","Only the number of carriers","Only the amount of ATP available"],"Both matter. Doubling carriers made the line steeper."],
["What happened when the number of carriers was doubled?","The rate of diffusion increased",["The rate of diffusion decreased","Diffusion stopped completely","Diffusion reversed direction"],"More carriers, more glucose moved at once. Steeper line."],
["What happened to facilitated diffusion as it approached the transport maximum?","The rate leveled off",["The rate kept rising forever","The rate dropped to zero","The rate reversed direction"],"Once every carrier is busy, adding more solute can't speed it up."],
["The transport maximum (Tmax) is reached when:","Every carrier is saturated",["The gradient becomes steeper","ATP runs out in the cell","Water stops crossing the membrane"],"Carriers are fully occupied, so the rate plateaus."],
["Why does glucose show up in the urine with uncontrolled diabetes?","Filtered glucose exceeds the carriers' Tmax",["The kidneys stop filtering glucose","Carriers pump glucose into the urine","Insulin blocks glucose reabsorption"],"So much glucose is filtered that the carriers are saturated. The extra spills into the urine."],
["In a hypotonic solution, water moves:","Into the cell, and it lyses",["Out of the cell, and it crenates","Equally both ways; no change","Into the cell, and it crenates"],"Lower solute outside, so water rushes in."],
["In an isotonic solution, a red blood cell:","Stays the same",["Lyses","Crenates","Divides"],"No net water movement."],
["In a hypertonic solution, water moves:","Out of the cell, and it crenates",["Into the cell, and it lyses","Equally both ways; no change","Out of the cell, and it lyses"],"Higher solute outside pulls water out. The cell shrivels."],
["What does a 300 mOsm solution of a NON-penetrating solute do to a cell?","Nothing; it's isotonic",["The cell swells and lyses","The cell shrinks and crenates","The cell pumps the solute in"],"The solute can't get in, osmolarity matches the cell, so no net water moves."],
["What does a 300 mOsm solution of a PENETRATING solute do to a cell?","The cell swells as solute and water enter",["Nothing; it's isotonic","The cell shrinks and crenates","The solute stays outside the cell"],"The solute crosses in, water follows it, and the cell swells. It acts hypotonic."],
["Why do 300 mOsm penetrating and non-penetrating solutions affect cells differently?","Only non-penetrating solutes set tonicity",["Penetrating solutes carry more charge","Non-penetrating solutes are lighter","Penetrating solutes block water"],"Same osmolarity, different tonicity. Tonicity depends on what can't cross."],
["Cortisol correlates strongly with resting heart rate in 200 adults. Does cortisol cause the higher heart rate?","Not proven; correlation isn't causation",["Yes; a strong correlation proves cause","Yes; 200 adults is enough proof","No; the correlation must be negative"],"A third variable could drive both. The problem is the study design, not the sample size."],
["Which variables could confound a cortisol–heart rate correlation?","Stress, caffeine, and fitness level",["Blood type, eye color, and height","Handedness, hair color, and shoe size","Birth month, accent, and IQ score"],"Stress raises both. Caffeine raises HR. Fitness lowers resting HR."],
["In the diffusion cause → mechanism → response, the response is:","Particles spread until evenly distributed",["Particles pile up on the high side","Water pumps the particles across","The membrane breaks down"],"Gradient exists → particles move down it → density evens out."]
]},

  let d = "M0 " + y0, seed = freq * 7 + amp;
  for (let x = 2; x <= w; x += 2){
    seed = (seed * 9301 + 49297) % 233280;
    const j = (seed / 233280 - .5) * amp * .12;
    const y = y0 + Math.sin(x / w * Math.PI * 2 * freq) * amp + j;
    d += " L" + x + " " + y.toFixed(1);
  }
  return d;
}
function spikes(n, amp, w, y0, seedStart){ // EMG burst
  let d = "M0 " + y0, seed = seedStart, x = 0;
  const step = w / n;
  for (let i = 0; i < n; i++){
    seed = (seed * 9301 + 49297) % 233280; const r = seed / 233280;
    x += step * (.6 + r * .8);
    if (x > w) break;
    const a = amp * (.55 + r * .45);

  return d + " L" + w + " " + y0;
}

  <p data-g="ear" data-k="2" hidden><b>Tympanic membrane</b> (eardrum) vibrates. The <b>eustachian tube</b> equalizes middle ear pressure so it can vibrate freely. Plane ear pop = eustachian tube.</p>
