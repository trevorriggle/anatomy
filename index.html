<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FAFBF7; --surface2:#E3E8E0; --ink:#17202A; --ink2:#4B5663; --ink3:#77818C;
  --line:#CAD2C7; --grid:rgba(23,32,42,.055);
  --k:#5E4396; --k-soft:#E6DFF2; --k-ink:#FFFFFF;
  --na:#B86A00; --na-soft:#F8E8C9;
  --good:#23734A; --good-soft:#DAEEE1; --bad:#B3342A; --bad-soft:#F5DDD9;
  --shadow:0 1px 0 rgba(23,32,42,.04), 0 8px 24px -16px rgba(23,32,42,.25);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131A; --surface:#171B24; --surface2:#1F2531; --ink:#E6E9EE; --ink2:#A4ADBA; --ink3:#7A8494;
    --line:#2B3240; --grid:rgba(230,233,238,.045);
    --k:#B49EE6; --k-soft:#272040; --k-ink:#14101F;
    --na:#F0AD45; --na-soft:#3A2B12;
    --good:#5CC48B; --good-soft:#15301F; --bad:#F07B6F; --bad-soft:#3A1B18;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131A; --surface:#171B24; --surface2:#1F2531; --ink:#E6E9EE; --ink2:#A4ADBA; --ink3:#7A8494;
  --line:#2B3240; --grid:rgba(230,233,238,.045);
  --k:#B49EE6; --k-soft:#272040; --k-ink:#14101F;
  --na:#F0AD45; --na-soft:#3A2B12;
  --good:#5CC48B; --good-soft:#15301F; --bad:#F07B6F; --bad-soft:#3A1B18;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:20px 120px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible, label:focus-within{outline:2px solid var(--k); outline-offset:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}

/* header */
.mast{display:grid; grid-template-columns:1fr; gap:8px; padding-block:8px 20px}
.mast h1{font-family:var(--display); font-weight:800; font-size:clamp(52px,11vw,104px); line-height:.86; letter-spacing:.005em; margin:0; text-transform:uppercase; text-wrap:balance}
.mast h1 span{color:var(--k)}
.mast p{margin:0; color:var(--ink2); max-width:60ch}
.trace{width:100%; height:auto; display:block; margin-top:10px; overflow:visible}
.trace .ax{stroke:var(--line); stroke-width:1}
.trace .th{stroke:var(--na); stroke-width:1; stroke-dasharray:4 4}
.trace .ln{fill:none; stroke:var(--k); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.trace text{font-family:var(--mono); font-size:11px; fill:var(--ink3)}
.trace .thl{fill:var(--na)}
@media (prefers-reduced-motion:no-preference){
  .trace .ln{stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 1.6s ease-out .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}

/* summary strip */
.strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-block:8px 16px}
.stat{background:var(--surface); padding:14px 16px}
.stat b{display:block; font-family:var(--display); font-weight:800; font-size:36px; line-height:1}
.stat small{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.actions{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 16px; font-weight:700; min-height:46px; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--k); border-color:var(--k); color:var(--k-ink)}
.btn.na{background:var(--na-soft); border-color:transparent; color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn .ct{font-family:var(--mono); font-weight:500; font-size:12px; opacity:.8}

details.watch{background:var(--na-soft); border-radius:14px; padding:4px 16px; margin-block:4px 24px}
details.watch summary{cursor:pointer; font-weight:700; padding:10px 0; list-style:none; display:flex; justify-content:space-between; gap:12px}
details.watch summary::-webkit-details-marker{display:none}
details.watch summary::after{content:"+"; font-family:var(--mono)}
details.watch[open] summary::after{content:"−"}
.watch ul{margin:0 0 12px; padding:0; list-style:none; display:grid; gap:10px}
.watch li b{display:block}
.watch li span{color:var(--ink2)}

/* units */
.unit{margin-top:28px}
.unit-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:12px}
.unit-h h2{font-family:var(--display); font-weight:800; font-size:32px; line-height:1; margin:0; text-transform:uppercase}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:12px; box-shadow:var(--shadow)}
.card.sel{border-color:var(--k); box-shadow:0 0 0 2px var(--k)}
.card-top{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.ring{width:54px; height:54px}
.ring circle{fill:none; stroke-width:5}
.ring .bgc{stroke:var(--surface2)}
.ring text{font-family:var(--mono); font-size:13px; font-weight:500; fill:var(--ink)}
.card h3{margin:0; font-size:17px; line-height:1.25}
.meta{font-family:var(--mono); font-size:12px; color:var(--ink3); margin-top:2px}
.pick{display:grid; place-items:center; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); cursor:pointer}
.pick input{width:20px; height:20px; accent-color:var(--k); cursor:pointer}
.card-btns{display:flex; flex-wrap:wrap; gap:6px}
.card-btns .btn{min-height:40px; padding:8px 12px; font-size:14px}
.chip{font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:99px; background:var(--surface2); color:var(--ink2); white-space:nowrap}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.na{background:var(--na-soft); color:var(--na)}

/* selection bar */
.selbar{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -10px 30px -20px rgba(0,0,0,.4); z-index:10}
.selbar .in{max-width:1080px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.selbar .lbl{font-weight:700; margin-right:auto}

/* quiz */
.qtop{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.qtop .ttl{font-family:var(--display); font-weight:800; font-size:28px; line-height:1; text-transform:uppercase; margin-right:auto}
.bar{height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-bottom:18px}
.bar i{display:block; height:100%; background:var(--k); transition:width .25s ease}
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(16px,4vw,28px); box-shadow:var(--shadow); max-width:780px; margin:0 auto}
.qmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.qtext{font-size:clamp(19px,2.6vw,23px); line-height:1.4; font-weight:700; margin:0 0 18px; text-wrap:pretty}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center; text-align:left; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; min-height:58px; font-size:17px; line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--k)}
.opt .key{font-family:var(--mono); font-size:13px; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:var(--surface2); color:var(--ink2)}
.opt.chosen{border-color:var(--k); background:var(--k-soft)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.right .key{background:var(--good); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--surface2)}
.fb b{display:block; margin-bottom:2px}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.qnav{display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap}
.hint{font-family:var(--mono); font-size:12px; color:var(--ink3)}
@media (hover:none){.hint{display:none}}

/* results */
.res{max-width:780px; margin:0 auto; display:grid; gap:16px}
.score{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; box-shadow:var(--shadow)}
.score .big{font-family:var(--display); font-weight:800; font-size:clamp(64px,14vw,112px); line-height:.85}
.score h2{margin:0 0 4px; font-size:20px}
.score p{margin:0; color:var(--ink2)}
.breakdown{display:grid; gap:6px}
.brow{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.miss{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.miss p{margin:0 0 8px; font-weight:700}
.miss .yours{color:var(--bad)} .miss .corr{color:var(--good)}
.miss small{display:block; color:var(--ink2); margin-top:6px}
.sech{font-family:var(--display); font-weight:800; font-size:24px; text-transform:uppercase; margin:8px 0 0}

/* study */
.study{max-width:860px; margin:0 auto}
.search{width:100%; font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); margin-bottom:16px}
.sq{padding:12px 0; border-bottom:1px solid var(--line)}
.sq p{margin:0 0 4px; font-weight:700}
.sq .a{color:var(--k); font-weight:700}
.sq small{display:block; color:var(--ink2)}
.empty{color:var(--ink2); padding:16px 0}
</style>

<script>
const UNITS=[{"name":"Cells & Membranes","deck":"Homeostasis & membrane transport","cats":["homeo","transport","osmo"]},{"name":"Neurophysiology","deck":"Nervous system · Nervous physiology pt 2","cats":["org","neuron","rmp","ap","synapse","nt"]},{"name":"Senses to Pain","deck":"Senses to pain · Parts A & B","cats":["receptors","optics","retina","hearing","balance","chem","pain"]}];
const CATS={"homeo":{"name":"Homeostasis & the Membrane","q":[["Blood sugar rises after a meal, insulin is released, and blood sugar drops back to normal. What kind of mechanism is this?","Negative feedback",["Positive feedback","Feedforward control","A conditioned reflex"],"The response reversed the original change. Reversal = negative feedback."],["Contractions during childbirth keep getting stronger until the baby is delivered. What kind of mechanism is this?","Positive feedback",["Negative feedback","Set point correction","Receptor desensitization"],"The response amplifies the change and stops only when a specific outcome (delivery) is reached."],["Which two systems regulate and coordinate the body to maintain homeostasis?","Nervous and endocrine",["Nervous and muscular","Endocrine and digestive","Immune and lymphatic"],"The deck names the nervous and endocrine systems as the regulators of homeostasis."],["Most homeostatic control in the body relies on which mechanism?","Negative feedback",["Positive feedback","Voluntary control","Learned reflexes"],"Negative feedback is the default because it keeps variables near their set point."],["Reflexes are generally described as:","Unlearned and involuntary",["Learned and voluntary","Learned and involuntary","Unlearned and voluntary"],"Reflexes are unpremeditated, unlearned and involuntary. Many happen without conscious awareness."],["In a reflex, which component detects the change in the environment?","Receptor",["Effector","Control center","Motor neuron"],"The receptor senses the stimulus. The effector carries out the response."],["In a reflex, which component is the muscle or gland that carries out the response?","Effector",["Receptor","Integrating center","Afferent pathway"],"Effectors are muscles or glands that produce the response."],["Why does the body use positive feedback so rarely?","It amplifies change until an endpoint",["It needs far more ATP than negative","It only runs through the endocrine system","It can only regulate body temperature"],"Positive feedback pushes a change further. It is only safe when there is a built-in finish line."],["Your temperature rises, you start sweating, and your temperature falls. In this loop, sweating is the:","The response that reverses it",["The stimulus that starts it","The set point it defends","The receptor sensing heat"],"Sweating is the effector response that brings temperature back down."],["The fluid mosaic model describes the plasma membrane as:","Proteins floating in a phospholipid bilayer",["A rigid wall of stacked cellulose fibers","A single sheet of cholesterol molecules","Proteins sandwiched between water layers"],"The bilayer is fluid and proteins drift within it like tiles in a mosaic."],["In the phospholipid bilayer, how do the heads and tails behave?","Heads hydrophilic, tails hydrophobic",["Heads hydrophobic, tails hydrophilic","Heads and tails both hydrophilic","Heads and tails both hydrophobic"],"Heads face the water on both sides. Tails hide in the middle, away from water."],["Growth hormone affects a cell by binding to which part of the plasma membrane?","Membrane receptors",["Membrane antigens","Phospholipid tails","Cholesterol molecules"],"Receptors let the membrane bind hormones, neurotransmitters, autocrine and paracrine chemicals."],["ABO and Rh blood typing depends on which feature of the plasma membrane?","Surface antigens",["Carrier proteins","Leak channels","Receptor enzymes"],"Specific membrane antigens are what blood and tissue typing detect."],["What does selectively permeable mean for the plasma membrane?","It controls what enters and leaves",["It lets every molecule pass freely","It blocks all water from crossing","It lets only ions cross the membrane"],"The membrane selects what crosses, which is essential for homeostasis and cell survival.",1],["In the body, water is the:","Solvent",["Solute","Solution","Suspension"],"Water is the body's solvent. Dissolved particles are solutes. Together they make a solution.",1],["A solute that is able to cross the membrane is called a:","Penetrating solute",["Nonpenetrating solute","Ionizing solute","Nonionizing solute"],"If it can cross, it's penetrating. If it can't, it's nonpenetrating.",1]]},"transport":{"name":"Membrane Transport","q":[["What defines passive transport?","No ATP; moves down the gradient",["Uses ATP; moves down the gradient","No ATP; moves against the gradient","Uses ATP; moves against the gradient"],"Passive transport costs no energy and always runs from high to low concentration.",1],["Which of these is NOT a form of passive transport?","Sodium-potassium pump",["Osmosis","Facilitated diffusion","Filtration"],"The Na+/K+ pump spends ATP, so it's active. The rest are passive.",1],["Side A has 6 Na+ and side B has 2 Na+, and the membrane is permeable to Na+. When does net diffusion stop?","When both sides reach 4",["When side B reaches 6","When side A reaches 0","When both sides reach 8"],"Diffusion runs until equilibrium: the total (8) splits evenly, 4 and 4.",1],["Which setup diffuses faster?","Side A 6, side B 2",["Side A 6, side B 5","Both at the same rate","Neither will diffuse"],"A bigger concentration difference (steeper gradient) means a faster rate.",1],["Sodium and glucose face the same concentration gradient. Which diffuses faster?","Sodium, because it's smaller",["Glucose, because it's larger","Both at exactly the same rate","Glucose, because it holds energy"],"Smaller, lighter particles diffuse faster.",1],["Which change would SLOW the rate of diffusion?","A larger molecule size",["A steeper gradient","More open channels","Higher lipid solubility"],"Size, gradient, solubility and channel/carrier number all set the rate. Bigger = slower."],["Why does glucose need protein carriers (facilitated diffusion) to cross the membrane?","It is too large to cross on its own",["It must move against its gradient","It needs ATP to enter the cell","It is repelled by the lipid tails"],"Glucose is a larger molecule, so carriers help it through. It still moves down its gradient.",1],["In facilitated diffusion, what happens if the membrane has more carriers?","Diffusion speeds up",["Diffusion slows down","Diffusion stops","Diffusion reverses"],"More carriers means more glucose can cross at once.",1],["What is the key difference between facilitated diffusion and active transport?","Active moves uphill using ATP",["Active uses no carrier protein","Facilitated moves uphill using ATP","Facilitated only moves water"],"Both use carrier proteins. Active transport goes against the gradient and costs ATP."],["What does one cycle of the sodium-potassium pump move?","3 Na+ out and 2 K+ in",["2 Na+ out and 3 K+ in","3 K+ out and 2 Na+ in","2 K+ out and 3 Na+ in"],"Three sodium leave, two potassium enter, one ATP spent.",1],["The sodium-potassium pump maintains which distribution?","High Na+ outside, high K+ inside",["High Na+ inside, high K+ outside","High Na+ and K+ both inside","Equal Na+ and K+ everywhere"],"Sodium is kept outside and potassium inside. Everything in the nerve unit depends on this."],["What is the first step of the sodium-potassium pump cycle?","Cytoplasmic Na+ binds the pump",["Extracellular K+ binds the pump","The phosphate group is released","K+ is released into the cell"],"Na+ binding from inside stimulates phosphorylation by ATP, which starts the cycle."],["What causes the pump protein to change shape and expel Na+?","Phosphorylation by ATP",["Binding of glucose","Release of potassium","Water pressure on the cell"],"ATP adds a phosphate, the protein changes shape, and Na+ is pushed outside."],["Exocytosis is best described as:","Vesicles releasing large materials out",["Channels letting small ions flow in","Water leaving the cell by osmosis","Carriers bringing glucose into cells"],"A vesicle fuses with the plasma membrane and spills its contents outside."],["When you have a cold, your cells release mucus using:","Exocytosis",["Endocytosis","Osmosis","Filtration"],"The deck's example: mucus is packaged in vesicles and released by exocytosis."],["Bulk transport (like exocytosis) is classified as:","Active transport",["Passive transport","Simple diffusion","Osmosis"],"Moving vesicles takes energy, so bulk transport is active.",1],["A poison disables every Na+/K+ pump in a neuron. What happens over time?","Gradients run down; it can't fire",["Sodium piles up outside the cell","Leak channels hold the gradients","The cell bursts within seconds"],"Leak channels slowly erase the gradients. Only the pump restores them."],["Filtration is classified as which type of transport?","Passive",["Active","Bulk","Pump-driven"],"Filtration uses pressure, not ATP, so it's passive.",1]]},"osmo":{"name":"Osmosis, Osmolarity & Tonicity","q":[["Osmosis is the movement of:","Water across a membrane",["Solutes across a membrane","Ions through membrane pumps","Proteins through channels"],"Osmosis is water following its own concentration gradient."],["During osmosis, water moves toward the side with:","More solute",["Less solute","More ATP","Lower pressure"],"Water moves toward the higher solute concentration."],["The membrane is NOT permeable to a solute. How is equilibrium reached?","Water moves across",["The solute moves across","Pumps move the solute","Nothing moves at all"],"If solutes can't move, water does the moving instead. That's osmosis.",1],["A 1 M solution of NaCl has an osmolarity of:","2 Osm",["1 Osm","3 Osm","0.5 Osm"],"NaCl splits into Na+ and Cl-, two particles."],["A 1 M solution of MgCl2 has an osmolarity of:","3 Osm",["2 Osm","1 Osm","4 Osm"],"MgCl2 splits into Mg2+ + 2 Cl-, three particles."],["A 1 M solution of glucose has an osmolarity of:","1 Osm",["2 Osm","3 Osm","0.5 Osm"],"Glucose doesn't ionize. It stays one particle."],["Why does NaCl count double in osmolarity compared to glucose?","It splits into two particles",["Its molecules weigh twice as much","It carries a double electric charge","It pulls water from both sides"],"Osmolarity counts dissolved particles, not molecules."],["Which of these is an ionizing solute?","Sodium chloride",["Glucose (C6H12O6)","Sucrose (table sugar)","Urea (CO(NH2)2)"],"Salts, acids and bases ionize. Sucrose, glucose and urea do not."],["The normal osmolarity inside a cell is about:","0.3 Osm (300 mOsm)",["0.1 Osm (100 mOsm)","0.6 Osm (600 mOsm)","3.0 Osm (3000 mOsm)"],"300 mOsm = 0.3 Osm is the body's normal value.",1],["A cell at 0.3 Osm is placed in a 0.1 Osm solution. What happens?","It swells and may lyse",["It shrinks and crenates","Nothing changes at all","It pumps out solutes"],"More solute inside, so water rushes in.",1],["A cell at 0.3 Osm is placed in a 0.1 Osm solution. That solution is:","Hypotonic",["Hypertonic","Isotonic","Hyperosmolar"],"Lower solute outside = hypotonic (hypoosmolar).",1],["A cell at 0.3 Osm is placed in a 0.6 Osm solution. What happens?","Water leaves and it crenates",["Water enters and it lyses","No net water movement","Solutes enter and it swells"],"More solute outside pulls water out, so the cell shrinks (crenates). Hypertonic.",1],["Crenation means the cell:","Shrinks",["Bursts","Swells","Divides"],"Crenate = shrivel. Lyse = burst."],["A cell at 0.3 Osm is placed in a 0.3 Osm solution. The solution is:","Isotonic",["Hypotonic","Hypertonic","Hypoosmolar"],"Same osmolarity on both sides = no net water movement.",1],["Tonicity describes:","A solution's effect on cell volume",["The total particle count in solution","How fast ions diffuse across","ATP used by membrane pumps"],"Tonicity is the effect osmolarity has on the cell's membrane tone via water movement."],["About what is 0.15 M NaCl relative to a normal cell?","Isotonic",["Hypotonic","Hypertonic","Pure water"],"0.15 M × 2 particles = 0.3 Osm, the same as the cell."],["In a hypotonic solution, where are solutes more concentrated?","Inside the cell",["Outside the cell","Equal on both sides","Inside the membrane"],"Hypotonic outside means the cell holds more solutes, so water flows in.",1],["When water moves into or out of a cell, it exerts:","Pressure on the membrane",["Charge on the membrane","Heat on the membrane","No force at all"],"The deck: water movement exerts a pressure on the membrane. That's the basis of tonicity."]]},"org":{"name":"Nervous System Organization","q":[["What are the nervous system's three functions, in order?","Sensory input, integration, motor output",["Integration, sensory input, motor output","Motor output, integration, sensory input","Sensory input, motor output, integration"],"Sense the change, process it, respond."],["The central nervous system consists of:","Brain and spinal cord",["Brain and cranial nerves","Spinal cord and spinal nerves","Cranial and spinal nerves"],"CNS = brain + spinal cord. Everything else is PNS.",1],["The peripheral nervous system consists of:","Cranial and spinal nerves",["Brain and spinal cord","Spinal cord and brainstem","Brainstem and cerebrum"],"PNS is everything outside the brain and spinal cord.",1],["Afferent (sensory) nerves carry signals:","From receptors to the CNS",["From the CNS to effectors","Between the two hemispheres","Only within the spinal cord"],"Afferent = arriving at the CNS.",1],["Efferent (motor) nerves carry signals:","From the CNS to effectors",["From receptors to the CNS","Between two interneurons","From glands to the brain"],"Efferent = exiting the CNS.",1],["Somatic motor nerves signal which tissue?","Skeletal muscle",["Cardiac muscle","Smooth muscle","Glands"],"Somatic = skeletal muscle, voluntary.",1],["Autonomic motor nerves signal which tissues?","Cardiac, smooth muscle, and glands",["Skeletal muscle only","Skeletal and cardiac muscle","Skin, joints, and special senses"],"Autonomic = involuntary targets.",1],["The sympathetic division is known as:","Fight or flight",["Rest and digest","Voluntary movement","Sensory integration"],"Sympathetic ramps the body up for stress.",1],["The parasympathetic division is known as:","Rest and digest",[" (function(){
const KEY = "bio2301-megahub-v1";
const ALL_IDS = [];
const BYID = {};
Object.entries(CATS).forEach(([cid, c]) => {
  c.q.forEach((x, i) => {
    const id = cid + "-" + i;
    const item = { id, cat: cid, q: x[0], a: x[1], d: x[2], e: x[3], n: !!x[4] };
    BYID[id] = item; ALL_IDS.push(id);
  });
  c.ids = c.q.map((_, i) => cid + "-" + i);
});

let store = { cats: {} };
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.cats) store = s; } catch(e){} }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
function cs(cid){ if (!store.cats[cid]) store.cats[cid] = { best: null, last: null, missed: [] }; return store.cats[cid]; }
load();

const app = document.getElementById("app");
const selected = new Set();
let session = null;
let view = "hub";
let studyScope = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function allMissed(){ return Object.keys(CATS).flatMap(c => cs(c).missed); }
function tone(p){ return p == null ? "var(--line)" : p >= 100 ? "var(--k)" : p >= 90 ? "var(--good)" : p >= 70 ? "var(--na)" : "var(--bad)"; }

function ring(p){
  const r = 22, C = 2 * Math.PI * r, v = p == null ? 0 : p;
  return `<svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="bgc" cx="27" cy="27" r="${r}"></circle>
  <circle cx="27" cy="27" r="${r}" stroke="${tone(p)}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v / 100)}" stroke-linecap="round" transform="rotate(-90 27 27)"></circle>
  <text x="27" y="31.5" text-anchor="middle">${p == null ? "—" : p + "%"}</text></svg>`;
}

/* ---------- HUB ---------- */
const TRACE = `<svg class="trace" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-label="Action potential trace from −70 to +30 millivolts">
  <line class="ax" x1="44" y1="118" x2="1000" y2="118"></line>
  <line class="th" x1="44" y1="100" x2="1000" y2="100"></line>
  <line class="ax" x1="44" y1="16" x2="1000" y2="16"></line>
  <text x="0" y="20">+30</text><text x="0" y="122">−70</text><text class="thl" x="0" y="98">−55</text>
  <path class="ln" d="M44 118 L150 118 C180 118 190 108 205 100 L218 100 C226 60 232 22 240 16 C250 14 258 70 268 120 C274 132 290 128 305 122 C330 118 380 118 420 118 L520 118 C540 118 548 108 560 101 L566 104 C574 110 580 116 600 118 L700 118 C720 118 726 110 738 100 L748 100 C756 60 762 22 770 16 C780 14 788 70 798 120 C804 132 820 128 835 122 C860 118 920 118 1000 118"></path>
</svg>`;

function renderHub(){
  view = "hub";
  const cats = Object.keys(CATS);
  const bests = cats.map(c => cs(c).best).filter(v => v != null);
  const overall = bests.length ? Math.round(bests.reduce((a, b) => a + b, 0) / cats.length) : 0;
  const cleared = cats.filter(c => cs(c).best === 100).length;
  const missed = allMissed().length;
  const noteIds = ALL_IDS.filter(id => BYID[id].n);

  let h = `<header class="mast">
    <div class="eyebrow">BIO 2301 · Human Physiology · Exam prep</div>
    <h1>Mega <span>Hub</span></h1>

    ${TRACE}
  </header>
  <div class="strip">

    <div class="stat"><b class="mono">${cleared}/${cats.length}</b><small>Sections at 100%</small></div>
    <div class="stat"><b class="mono">${missed}</b><small>In missed bucket</small></div>
    <div class="stat"><b class="mono">${ALL_IDS.length}</b><small>Total questions</small></div>
  </div>
  <div class="actions">
    <button class="btn primary" data-act="all-practice">Practice everything <span class="ct">${ALL_IDS.length}</span></button>
    <button class="btn" data-act="all-exam">Full exam <span class="ct">${ALL_IDS.length}</span></button>
    <button class="btn na" data-act="all-missed" ${missed ? "" : "disabled"}>Drill all missed <span class="ct">${missed}</span></button>
    <button class="btn" data-act="notes">From my notes <span class="ct">${noteIds.length}</span></button>
    <button class="btn ghost" data-act="study-all">Study sheet</button>
    <button class="btn ghost danger" data-act="reset-all" id="reset-all">Reset everything</button>
  </div>
  <details class="watch"><summary>Watch-outs from your notes</summary><ul>
    ${WATCHOUTS.map(w => `<li><b>${esc(w[0])}</b><span>${esc(w[1])}</span></li>`).join("")}
  </ul></details>`;

  UNITS.forEach(u => {
    const n = u.cats.reduce((a, c) => a + CATS[c].ids.length, 0);
    h += `<section class="unit"><div class="unit-h"><h2>${esc(u.name)}</h2><span class="eyebrow">${esc(u.deck)} · ${n} Qs</span></div><div class="grid">`;
    u.cats.forEach(cid => {
      const c = CATS[cid], s = cs(cid), m = s.missed.length;
      const nn = c.ids.filter(id => BYID[id].n).length;
      h += `<article class="card ${selected.has(cid) ? "sel" : ""}">
        <div class="card-top">${ring(s.best)}
          <div><h3>${esc(c.name)}</h3>
            <div class="meta">${c.ids.length} Qs · best ${s.best == null ? "—" : s.best + "%"} · last ${s.last == null ? "—" : s.last + "%"}</div>
          </div>
          <label class="pick" title="Add to a custom mix"><input type="checkbox" id="pick-${cid}" data-pick="${cid}" ${selected.has(cid) ? "checked" : ""} aria-label="Add ${esc(c.name)} to mix"></label>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${m ? `<span class="chip bad">${m} missed</span>` : s.best === 100 ? `<span class="chip good">Cleared</span>` : ""}
          ${nn ? `<span class="chip na">${nn} from notes</span>` : ""}
        </div>
        <div class="card-btns">
          <button class="btn primary" data-act="cat-practice" data-cat="${cid}">Practice</button>
          <button class="btn" data-act="cat-exam" data-cat="${cid}">Exam</button>
          <button class="btn" data-act="cat-study" data-cat="${cid}">Study</button>
          ${m ? `<button class="btn na" data-act="cat-missed" data-cat="${cid}">Missed ${m}</button>` : ""}
          <button class="btn ghost danger" data-act="cat-reset" data-cat="${cid}">Reset</button>
        </div>
      </article>`;
    });
    h += `</div></section>`;
  });

  if (selected.size){
    const n = [...selected].reduce((a, c) => a + CATS[c].ids.length, 0);
    h += `<div class="selbar"><div class="in"><span class="lbl">${selected.size} section${selected.size > 1 ? "s" : ""} · ${n} Qs</span>
      <button class="btn primary" data-act="mix-practice">Practice mix</button>
      <button class="btn" data-act="mix-exam">Exam mix</button>
      <button class="btn ghost" data-act="mix-clear">Clear</button></div></div>`;
  }
  app.innerHTML = h;
}

/* ---------- SESSION ---------- */
function start(mode, ids, title, fullCats){
  if (!ids.length) return;
  session = {
    mode, title, fullCats: fullCats || [],
    items: shuffle(ids).map(id => {
      const b = BYID[id];
      const opts = shuffle([b.a, ...b.d]);
      return { id, opts, correct: opts.indexOf(b.a) };
    }),
    i: 0, picks: [], locked: false
  };
  view = "quiz"; renderQuiz(); window.scrollTo(0, 0);
}

function renderQuiz(){
  const s = session, it = s.items[s.i], b = BYID[it.id];
  const pick = s.picks[s.i];
  const answered = s.mode === "practice" && pick != null;
  const done = s.picks.filter(p => p != null).length;
  const right = s.items.reduce((a, x, i) => a + (s.picks[i] === x.correct ? 1 : 0), 0);
  const pct = Math.round((s.i) / s.items.length * 100);

  let opts = it.opts.map((o, k) => {
    let cls = "opt";
    if (s.mode === "practice" && answered){
      if (k === it.correct) cls += " right"; else if (k === pick) cls += " wrong";
    } else if (pick === k) cls += " chosen";
    return `<button class="${cls}" data-opt="${k}" ${answered ? "disabled" : ""}><span class="key">${k + 1}</span><span>${esc(o)}</span></button>`;
  }).join("");

  let fb = "";
  if (answered){
    const ok = pick === it.correct;
    fb = `<div class="fb ${ok ? "good" : "bad"}"><b>${ok ? "Correct." : "Not quite. Answer: " + esc(b.a)}</b>${esc(b.e)}</div>`;
  }
  const last = s.i === s.items.length - 1;
  const canNext = pick != null;

  app.innerHTML = `<div class="qtop">
      <div class="ttl">${esc(s.title)}</div>
      <span class="chip">${s.mode === "practice" ? "Practice" : "Exam"}</span>
      ${s.mode === "practice" ? `<span class="chip good mono">${right}/${done} right</span>` : ""}
      <button class="btn ghost" data-act="quit">Quit</button>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="eyebrow">Q ${s.i + 1} of ${s.items.length}</span><span class="chip">${esc(CATS[b.cat].name)}</span>${b.n ? `<span class="chip na">From your notes</span>` : ""}</div>
      <p class="qtext">${esc(b.q)}</p>
      <div class="opts">${opts}</div>
      ${fb}
      <div class="qnav"><span class="hint">Keys 1–4 to answer · Enter for next</span>
        <button class="btn primary" data-act="next" ${canNext ? "" : "disabled"}>${last ? "Finish" : "Next"}</button></div>
    </div>`;
}

function choose(k){
  const s = session; if (!s) return;
  if (s.mode === "practice" && s.picks[s.i] != null) return;
  s.picks[s.i] = k;
  if (s.mode === "practice") track(s.items[s.i], k);
  renderQuiz();
}

function track(it, k){
  const b = BYID[it.id], c = cs(b.cat);
  const idx = c.missed.indexOf(it.id);
  if (k === it.correct){ if (idx > -1) c.missed.splice(idx, 1); }
  else if (idx === -1) c.missed.push(it.id);
  save();
}

function next(){
  const s = session; if (!s || s.picks[s.i] == null) return;
  if (s.i < s.items.length - 1){ s.i++; renderQuiz(); window.scrollTo(0, 0); }
  else finish();
}

function finish(){
  const s = session;
  if (s.mode === "exam") s.items.forEach((it, i) => track(it, s.picks[i]));
  const per = {};
  s.items.forEach((it, i) => {
    const cat = BYID[it.id].cat; per[cat] = per[cat] || { r: 0, t: 0 };
    per[cat].t++; if (s.picks[i] === it.correct) per[cat].r++;
  });
  s.fullCats.forEach(cat => {
    if (!per[cat]) return;
    const p = Math.round(per[cat].r / per[cat].t * 100), c = cs(cat);
    c.last = p; c.best = c.best == null ? p : Math.max(c.best, p);
  });
  save();
  s.per = per; view = "results"; renderResults(); window.scrollTo(0, 0);
}

function renderResults(){
  const s = session;
  const right = s.items.filter((it, i) => s.picks[i] === it.correct).length;
  const pct = Math.round(right / s.items.length * 100);
  const misses = s.items.map((it, i) => ({ it, pick: s.picks[i] })).filter(x => x.pick !== x.it.correct);
  const verdict = pct === 100 ? "Clean sweep. That section is locked in." : pct >= 90 ? "Close. Clean up the misses and run it again." : pct >= 70 ? "Getting there. Drill the misses, then rerun." : "Rough run. Hit Study first, then drill.";
  const cats = Object.keys(s.per);
  let h = `<div class="res">
    <div class="qtop"><div class="ttl">${esc(s.title)}</div><span class="chip">${s.mode === "practice" ? "Practice" : "Exam"} results</span></div>
    <div class="score"><div class="big mono" style="color:${tone(pct)}">${pct}%</div>
      <div><h2>${right} of ${s.items.length} correct</h2><p>${verdict}</p>
      ${s.fullCats.length ? "" : `<p class="eyebrow" style="margin-top:6px">Drill runs don't change section scores</p>`}</div></div>
    <div class="actions">
      ${misses.length ? `<button class="btn na" data-act="retry-miss">Drill these ${misses.length} misses</button>` : ""}
      <button class="btn primary" data-act="again">Run it again</button>
      <button class="btn" data-act="home">Back to hub</button>
    </div>`;
  if (cats.length > 1){
    h += `<h3 class="sech">By section</h3><div class="breakdown">` + cats.map(c => {
      const p = Math.round(s.per[c].r / s.per[c].t * 100);
      return `<div class="brow"><span>${esc(CATS[c].name)}</span><span class="mono" style="color:${tone(p)}">${s.per[c].r}/${s.per[c].t} · ${p}%</span></div>`;
    }).join("") + `</div>`;
  }
  if (misses.length){
    h += `<h3 class="sech">What you missed</h3>` + misses.map(({ it, pick }) => {
      const b = BYID[it.id];
      return `<div class="miss"><p>${esc(b.q)}</p>
        <div class="yours">You: ${esc(it.opts[pick])}</div>
        <div class="corr">Answer: ${esc(b.a)}</div>
        <small>${esc(b.e)}</small></div>`;
    }).join("");
  }
  h += `</div>`;
  app.innerHTML = h;
  session.missIds = misses.map(x => x.it.id);
}

/* ---------- STUDY ---------- */
function renderStudy(catIds, q){
  view = "study"; studyScope = catIds;
  const term = (q || "").trim().toLowerCase();
  let body = "";
  catIds.forEach(cid => {
    const rows = CATS[cid].ids.map(id => BYID[id]).filter(b => !term || (b.q + " " + b.a + " " + b.e).toLowerCase().includes(term));
    if (!rows.length) return;
    body += `<h3 class="sech">${esc(CATS[cid].name)}</h3>` + rows.map(b => `<div class="sq"><p>${esc(b.q)}${b.n ? ` <span class="chip na">notes</span>` : ""}</p><div class="a">${esc(b.a)}</div><small>${esc(b.e)}</small></div>`).join("");
  });
  const title = catIds.length === 1 ? CATS[catIds[0]].name : "Study sheet";
  const results = body || `<p class="empty">Nothing matches "${esc(q)}".</p>`;
  if (document.getElementById("study-body")){ document.getElementById("study-body").innerHTML = results; return; }
  app.innerHTML = `<div class="study">
    <div class="qtop"><div class="ttl">${esc(title)}</div>
      ${catIds.length === 1 ? `<button class="btn primary" data-act="cat-practice" data-cat="${catIds[0]}">Practice this</button>` : ""}
      <button class="btn ghost" data-act="home">Back to hub</button></div>
    <input class="search" id="study-search" type="search" placeholder="Search questions, answers, explanations" autocomplete="off">
    <div id="study-body">${results}</div></div>`;
  window.scrollTo(0, 0);
}

/* ---------- EVENTS ---------- */
const armed = {};
function arm(btn, key, run){
  if (armed[key]){ clearTimeout(armed[key]); delete armed[key]; run(); return; }
  btn.classList.add("armed"); btn.textContent = "Tap again to reset";
  armed[key] = setTimeout(() => { delete armed[key]; if (view === "hub") renderHub(); }, 3000);
}

app.addEventListener("click", e => {
  const o = e.target.closest("[data-opt]"); if (o){ choose(+o.dataset.opt); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, cid = b.dataset.cat;
  const cats = Object.keys(CATS);
  switch (act){
    case "all-practice": start("practice", ALL_IDS, "Everything", cats); break;
    case "all-exam": start("exam", ALL_IDS, "Full exam", cats); break;
    case "all-missed": start("practice", allMissed(), "All missed"); break;
    case "notes": start("practice", ALL_IDS.filter(id => BYID[id].n), "From my notes"); break;
    case "study-all": renderStudy(cats); break;
    case "reset-all": arm(b, "all", () => { store = { cats: {} }; save(); selected.clear(); renderHub(); }); break;
    case "cat-practice": start("practice", CATS[cid].ids, CATS[cid].name, [cid]); break;
    case "cat-exam": start("exam", CATS[cid].ids, CATS[cid].name, [cid]); break;
    case "cat-study": renderStudy([cid]); break;
    case "cat-missed": start("practice", cs(cid).missed, CATS[cid].name + ": missed"); break;
    case "cat-reset": arm(b, cid, () => { store.cats[cid] = { best: null, last: null, missed: [] }; save(); renderHub(); }); break;
    case "mix-practice": case "mix-exam": {
      const list = cats.filter(c => selected.has(c));
      start(act === "mix-practice" ? "practice" : "exam", list.flatMap(c => CATS[c].ids), "Custom mix", list); break;
    }
    case "mix-clear": selected.clear(); renderHub(); break;
    case "next": next(); break;
    case "quit": session = null; renderHub(); window.scrollTo(0, 0); break;
    case "home": session = null; renderHub(); window.scrollTo(0, 0); break;
    case "again": start(session.mode, session.items.map(x => x.id), session.title, session.fullCats); break;
    case "retry-miss": start("practice", session.missIds, session.title + ": misses"); break;
  }
});

app.addEventListener("change", e => {
  const p = e.target.closest("[data-pick]"); if (!p) return;
  const cid = p.dataset.pick;
  p.checked ? selected.add(cid) : selected.delete(cid);
  const y = window.scrollY; renderHub(); window.scrollTo(0, y);
});

app.addEventListener("input", e => {
  if (e.target.id === "study-search") renderStudy(studyScope, e.target.value);
});

document.addEventListener("keydown", e => {
  if (view !== "quiz" || !session) return;
  if (e.target.tagName === "INPUT") return;
  if (["1","2","3","4"].includes(e.key)) { e.preventDefault(); choose(+e.key - 1); }
  else if (e.key === "Enter") { e.preventDefault(); next(); }
});

renderHub();
})();
</script>
