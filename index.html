<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO 2301 Unit 2 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FAFBF7; --surface2:#E3E8E0; --ink:#17202A; --ink2:#4B5663; --ink3:#77818C;
  --line:#CAD2C7; --grid:rgba(23,32,42,.055);
  --k:#5E4396; --k-soft:#E6DFF2; --k-ink:#FFFFFF;
  --na:#B86A00; --na-soft:#F8E8C9;
  --good:#23734A; --good-soft:#DAEEE1; --bad:#B3342A; --bad-soft:#F5DDD9;
  --shadow:0 1px 0 rgba(23,32,42,.04), 0 8px 24px -16px rgba(23,32,42,.25);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131A; --surface:#171B24; --surface2:#1F2531; --ink:#E6E9EE; --ink2:#A4ADBA; --ink3:#7A8494;
    --line:#2B3240; --grid:rgba(230,233,238,.045);
    --k:#B49EE6; --k-soft:#272040; --k-ink:#14101F;
    --na:#F0AD45; --na-soft:#3A2B12;
    --good:#5CC48B; --good-soft:#15301F; --bad:#F07B6F; --bad-soft:#3A1B18;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131A; --surface:#171B24; --surface2:#1F2531; --ink:#E6E9EE; --ink2:#A4ADBA; --ink3:#7A8494;
  --line:#2B3240; --grid:rgba(230,233,238,.045);
  --k:#B49EE6; --k-soft:#272040; --k-ink:#14101F;
  --na:#F0AD45; --na-soft:#3A2B12;
  --good:#5CC48B; --good-soft:#15301F; --bad:#F07B6F; --bad-soft:#3A1B18;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:20px 120px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible, label:focus-within{outline:2px solid var(--k); outline-offset:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}

/* header */
.mast{display:grid; grid-template-columns:1fr; gap:8px; padding-block:8px 20px}
.mast h1{font-family:var(--display); font-weight:800; font-size:clamp(52px,11vw,104px); line-height:.86; letter-spacing:.005em; margin:0; text-transform:uppercase; text-wrap:balance}
.mast h1 span{color:var(--k)}
.mast p{margin:0; color:var(--ink2); max-width:60ch}
.trace{width:100%; height:auto; display:block; margin-top:10px; overflow:visible}
.trace .ax{stroke:var(--line); stroke-width:1}
.trace .th{stroke:var(--na); stroke-width:1; stroke-dasharray:4 4}
.trace .ln{fill:none; stroke:var(--k); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.trace text{font-family:var(--mono); font-size:11px; fill:var(--ink3)}
.trace .thl{fill:var(--na)}
@media (prefers-reduced-motion:no-preference){
  .trace .ln{stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 1.6s ease-out .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}

/* tabs */
.tabs{display:flex; gap:4px; padding:4px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; margin-block:4px 16px; width:max-content; max-width:100%}
.tab{border:0; background:transparent; border-radius:9px; padding:10px 18px; min-height:44px; font-weight:700; color:var(--ink2)}
.tab.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.tab .ct{font-family:var(--mono); font-weight:500; font-size:12px; opacity:.7; margin-left:6px}

/* summary strip */
.strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-block:8px 16px}
.stat{background:var(--surface); padding:14px 16px}
.stat b{display:block; font-family:var(--display); font-weight:800; font-size:36px; line-height:1}
.stat small{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.actions{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 16px; font-weight:700; min-height:46px; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--k); border-color:var(--k); color:var(--k-ink)}
.btn.na{background:var(--na-soft); border-color:transparent; color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad); border-color:var(--bad); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn .ct{font-family:var(--mono); font-weight:500; font-size:12px; opacity:.8}

details.watch{background:var(--na-soft); border-radius:14px; padding:4px 16px; margin-block:4px 24px}
details.watch summary{cursor:pointer; font-weight:700; padding:10px 0; list-style:none; display:flex; justify-content:space-between; gap:12px}
details.watch summary::-webkit-details-marker{display:none}
details.watch summary::after{content:"+"; font-family:var(--mono)}
details.watch[open] summary::after{content:"−"}
.watch ul{margin:0 0 12px; padding:0; list-style:none; display:grid; gap:10px}
.watch li b{display:block}
.watch li span{color:var(--ink2)}

/* units */
.unit{margin-top:28px}
.unit-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:12px}
.unit-h h2{font-family:var(--display); font-weight:800; font-size:32px; line-height:1; margin:0; text-transform:uppercase}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:12px; box-shadow:var(--shadow)}
.card.sel{border-color:var(--k); box-shadow:0 0 0 2px var(--k)}
.card-top{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.ring{width:54px; height:54px}
.ring circle{fill:none; stroke-width:5}
.ring .bgc{stroke:var(--surface2)}
.ring text{font-family:var(--mono); font-size:13px; font-weight:500; fill:var(--ink)}
.card h3{margin:0; font-size:17px; line-height:1.25}
.meta{font-family:var(--mono); font-size:12px; color:var(--ink3); margin-top:2px}
.pick{display:grid; place-items:center; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); cursor:pointer}
.pick input{width:20px; height:20px; accent-color:var(--k); cursor:pointer}
.card-btns{display:flex; flex-wrap:wrap; gap:6px}
.card-btns .btn{min-height:40px; padding:8px 12px; font-size:14px}
.chip{font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:99px; background:var(--surface2); color:var(--ink2); white-space:nowrap}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.na{background:var(--na-soft); color:var(--na)}

/* selection bar */
.selbar{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -10px 30px -20px rgba(0,0,0,.4); z-index:10}
.selbar .in{max-width:1080px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.selbar .lbl{font-weight:700; margin-right:auto}

/* quiz */
.qtop{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.qtop .ttl{font-family:var(--display); font-weight:800; font-size:28px; line-height:1; text-transform:uppercase; margin-right:auto}
.bar{height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-bottom:18px}
.bar i{display:block; height:100%; background:var(--k); transition:width .25s ease}
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(16px,4vw,28px); box-shadow:var(--shadow); max-width:780px; margin:0 auto}
.qmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.qtext{font-size:clamp(19px,2.6vw,23px); line-height:1.4; font-weight:700; margin:0 0 18px; text-wrap:pretty}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center; text-align:left; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; min-height:58px; font-size:17px; line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--k)}
.opt .key{font-family:var(--mono); font-size:13px; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:var(--surface2); color:var(--ink2)}
.opt.chosen{border-color:var(--k); background:var(--k-soft)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.right .key{background:var(--good); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--surface2)}
.fb b{display:block; margin-bottom:2px}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.qnav{display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap}
.hint{font-family:var(--mono); font-size:12px; color:var(--ink3)}
@media (hover:none){.hint{display:none}}

/* results */
.res{max-width:780px; margin:0 auto; display:grid; gap:16px}
.score{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; box-shadow:var(--shadow)}
.score .big{font-family:var(--display); font-weight:800; font-size:clamp(64px,14vw,112px); line-height:.85}
.score h2{margin:0 0 4px; font-size:20px}
.score p{margin:0; color:var(--ink2)}
.breakdown{display:grid; gap:6px}
.brow{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.miss{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.miss p{margin:0 0 8px; font-weight:700}
.miss .yours{color:var(--bad)} .miss .corr{color:var(--good)}
.miss small{display:block; color:var(--ink2); margin-top:6px}
.sech{font-family:var(--display); font-weight:800; font-size:24px; text-transform:uppercase; margin:8px 0 0}

/* study */
.study{max-width:860px; margin:0 auto}
.search{width:100%; font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); margin-bottom:16px}
.sq{padding:12px 0; border-bottom:1px solid var(--line)}
.sq p{margin:0 0 4px; font-weight:700}
.sq .a{color:var(--k); font-weight:700}
.sq small{display:block; color:var(--ink2)}
.empty{color:var(--ink2); padding:16px 0}

[hidden]{display:none !important}
.tab.ct-tab.on{background:var(--k); color:var(--k-ink)}
.primer .pr, .study .pr{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(14px,3vw,22px); margin-block:14px; box-shadow:var(--shadow)}
.pr h3{font-family:var(--display); font-weight:800; font-size:26px; text-transform:uppercase; margin:0 0 12px; line-height:1}
.pr p{margin:0 0 10px}
.mn{display:grid; gap:2px; border-left:4px solid var(--k); background:var(--k-soft); border-radius:0 10px 10px 0; padding:10px 14px; margin-top:10px}
.mn b{font-size:16px}
.mn span{color:var(--ink2)}
.tblw{overflow-x:auto; margin-inline:-4px}
.tbl{width:100%; border-collapse:collapse; font-size:15px}
.tbl th{text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); padding:6px 8px; border-bottom:2px solid var(--line)}
.tbl td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top}
.dg{width:100%; height:auto; display:block; margin-block:6px 4px; overflow:visible}
.dg .lb{font-family:var(--mono); font-size:13px; fill:var(--ink)}
.dg .lb.sm{font-size:11.5px; fill:var(--ink2)}
.dg .k{fill:var(--k)} .dg .na{fill:var(--na)} .dg .bad{fill:var(--bad)}
.dg .gl{stroke:var(--line); stroke-width:1}
.dg .th{stroke:var(--na); stroke-dasharray:5 5}
.dg .ln{fill:none; stroke:var(--k); stroke-width:3; stroke-linejoin:round}
.dg .ref{fill:var(--bad-soft)} .dg .ref2{fill:var(--na-soft)}
.dg .pt{fill:var(--k)} .dg .pn{fill:var(--k-ink); font-family:var(--mono); font-size:13px; text-anchor:middle; font-weight:500}
.dg .ax{fill:var(--k-soft); stroke:var(--k)}
.dg .term{fill:var(--k-soft); stroke:var(--k); stroke-width:2}
.dg .ves{fill:var(--na-soft); stroke:var(--na); stroke-width:2}
.dg .ch{fill:var(--k)}
.dg .nt{r:4px; fill:var(--na)}
.dg .post{fill:var(--surface2); stroke:var(--line); stroke-width:2}
.dg .psd{fill:var(--k)}
.dg .arr{fill:none; stroke:var(--ink2); stroke-width:2; marker-end:url(#ah)}
.dg path.arr.na{stroke:var(--na)}
.dg .hl{fill:none; stroke:var(--bad); stroke-width:3; stroke-dasharray:6 4}
.dg .nd{fill:var(--surface2); stroke:var(--ink2); stroke-width:2}
.dg circle.nd.k{fill:var(--k)}
.dg .bm{fill:url(#bmg); stroke:var(--ink2); stroke-width:1.5}
.dg .gel{fill:var(--k-soft); stroke:var(--k)}
.dg .oto{fill:var(--na); stroke:var(--surface); stroke-width:1}
.dg .hair{stroke:var(--ink2); stroke-width:2; fill:none}
.dg .hc{fill:var(--surface2); stroke:var(--ink2)}
.dg .cup{fill:var(--k-soft); stroke:var(--k); stroke-width:2}
.dg .eye{fill:var(--surface2); stroke:var(--ink2); stroke-width:2}
.dg .fib{fill:none; stroke-width:4; stroke-linecap:round; opacity:.85}
.dg path.fib.k{stroke:var(--k)} .dg path.fib.na{stroke:var(--na)}
.dg.narrow{max-width:420px; margin-inline:auto}
.dg .chx{fill:var(--surface2); stroke:var(--ink3); stroke-dasharray:4 3}
.dg .x{stroke:var(--bad); stroke-width:6; stroke-linecap:round}
.dg .wv{fill:none; stroke:var(--k); stroke-width:1.6; stroke-linejoin:round}
.dg path.wv.na{stroke:var(--na)} .dg path.wv.bd{stroke:var(--bad)}
.dg .bx{fill:var(--surface2); stroke:var(--ink2); stroke-width:1.5}
.dg rect.bx.k{fill:var(--k-soft); stroke:var(--k)}
.dg .fb{fill:none; stroke:var(--bad); stroke-width:2; stroke-dasharray:6 5; marker-end:url(#ahb)}
.seg{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.sbtn{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; min-height:40px; font-weight:700; font-size:14px}
.sbtn.on{background:var(--k); border-color:var(--k); color:var(--k-ink)}
.stepbox{background:var(--surface2); border-radius:12px; padding:12px 14px; margin-top:6px}
.stepbox p{margin:0}
.flow{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px}
.fs{background:var(--surface2); border-radius:12px; padding:12px; display:grid; gap:6px; position:relative}
.fs b{font-family:var(--display); font-weight:800; font-size:20px; text-transform:uppercase}
.fs span{font-size:14px; color:var(--ink2)}
.tag{font-style:normal; font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:99px; background:var(--surface); white-space:nowrap}
.tag.k{color:var(--k)} .tag.bad{color:var(--bad)} .tag.na{color:var(--na)}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px}
.card2{background:var(--surface2); border-radius:12px; padding:12px}
.card2 h4{margin:0 0 6px; font-size:16px}
.card2 p{margin:0; font-size:15px; color:var(--ink2)}
.scale{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:6px}
.scale div{background:var(--good-soft); border-radius:10px; padding:8px 10px; display:grid}
.scale div.bad{background:var(--bad-soft)}
.scale b{font-family:var(--mono)} .scale span{font-size:13px; color:var(--ink2)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.gc{background:var(--surface2); border-radius:12px; padding:12px; display:grid; gap:2px}
.gc small{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3)}
.gc b{font-family:var(--display); font-weight:800; font-size:26px}
.gc span{font-size:14px; color:var(--ink2)}
.box{width:100%; min-height:140px; font-family:var(--mono); font-size:12px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); margin-bottom:10px}
.hint2{color:var(--bad); margin:0}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:700; opacity:0; pointer-events:none; transition:.2s; z-index:50}
.toast.on{opacity:1; transform:translate(-50%,0)}
.tabs{flex-wrap:wrap; width:auto}
.trace .ln{stroke-dasharray:4000; stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){.trace .ln{stroke-dashoffset:4000; animation:draw 2s ease-out .2s forwards}}
.tab{padding:10px 14px}
.calc{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-block:8px}
.calc label{display:grid; gap:4px; font-family:var(--mono); font-size:12px; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em}
.calc input{font:inherit; font-size:18px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%}
.dg .lb.k{fill:var(--k)} .dg .lb.na{fill:var(--na)} .dg .lb.bad{fill:var(--bad)} .dg .lb.good{fill:var(--good)}
.dg .wv.ink{stroke:var(--ink2)}
.dg .gd{fill:var(--good-soft); stroke:var(--good)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" style="fill:var(--ink2)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--bad)"/></marker>
<linearGradient id="bmg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--k)"/><stop offset="1" style="stop-color:var(--na)"/></linearGradient>
</defs></svg>
<div class="wrap" id="app"></div>

<script>
const UNITS = [];
const CATS = {};
const W = {};
const MN = (t, b) => `<div class="mn"><b>${t}</b><span>${b}</span></div>`;
const STEP = (g, labels) => `<div class="seg" role="group" aria-label="Step">${labels.map((s, i) => `<button class="sbtn ${i === 0 ? "on" : ""}" data-act="show" data-g="${g}" data-k="${i}">${s}</button>`).join("")}</div>`;
const PANES = (g, items) => items.map((h, i) => `<div class="stepbox" data-g="${g}" data-k="${i}" ${i ? "hidden" : ""}>${h}</div>`).join("");
const TBL = (head, rows) => `<div class="tblw"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td>${i === 0 ? `<b>${c}</b>` : c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function wave(freq, amp, w, y0, seedX){
  let d = "M0 " + y0, seed = freq * 7 + amp + (seedX || 0);
  for (let x = 2; x <= w; x += 2){
    seed = (seed * 9301 + 49297) % 233280;
    const j = (seed / 233280 - .5) * amp * .12;
    const y = y0 + Math.sin(x / w * Math.PI * 2 * freq) * amp + j;
    d += " L" + x + " " + y.toFixed(1);
  }
  return d;
}

<p>The cerebellum can keep you balanced with <b>any 2 of its 3 inputs</b>: <b>eyes</b>, <b>proprioceptors</b>, <b>vestibular apparatus</b>. Closing the eyes removes one. If one of the other two is broken, you're down to one input and you sway.</p>

${MN("Heads up: her slides disagree with themselves", "One slide says failing a Romberg is 'most likely the cerebellum.' The Romberg slides say the test is only valid WITHOUT a cerebellar problem and is really testing vestibular + proprioceptors. If a question is about interpreting a positive Romberg, go with the Romberg slides.")}

["As stroke volume increases, blood pressure generally:","Increases",["Decreases","Stays fixed","Becomes negative"],"More CO."],
["Anything that lowers venous return will:","Lower systemic BP",["Raise systemic BP","Raise heart rate permanently","Increase stroke volume"],"Less blood back = less CO."],
["Which helps venous return?","Respiratory and muscular pumps",["Thick muscular vein walls","High venous pressure (120)","Semilunar valves in veins"],"Plus valves and a big lumen."],
["Average venous pressure is about:","20 mmHg",["120 mmHg","60 mmHg","80 mmHg"],"Steady, low."],
["Increased sympathetic activity raises BP mainly through:","Generalized vasoconstriction and more CO",["Vasodilation of skin vessels","Lower heart rate","Releasing ANF"],"Squeeze the vessels, pump harder."],
["Parasympathetic stimulation affects BP by:","Causing vasodilation and lowering BP",["Causing vasoconstriction","Raising heart rate","Releasing epinephrine"],"ACh → vasodilation."],
["Epinephrine from the adrenal medulla:","Raises BP",["Lowers BP","Has no effect on BP","Only affects glucose"],"More CO + vasoconstriction."],
["Vasopressin (ADH) raises BP by:","Conserving water and vasoconstricting",["Excreting sodium","Dilating arterioles","Slowing the heart"],"Important after severe hemorrhage."],
["The renin-angiotensin system responds to low BP by:","Vasoconstricting and releasing aldosterone",["Vasodilating and excreting water","Releasing ANF","Lowering heart rate"],"Rapid rise in BP."],
["Aldosterone, triggered by angiotensin, raises blood volume by:","Reabsorbing sodium (and water)",["Excreting sodium","Breaking down RBCs","Lowering thyroxine"],"Water follows sodium."],
["Increased blood viscosity causes:","More resistance, higher BP",["Less resistance, lower BP","No change","Lower cardiac output only"],"Thicker fluid, harder to push."],
["Gaining 50 pounds raises BP partly because of:","Longer total vessel length (more resistance)",["Lower blood viscosity in the new tissue","Fewer capillaries supplying the body","A slower resting heart rate overall"],"Miles of new vessels to push through."],
["Endothelin is:","A potent vasoconstrictor that raises BP",["A vasodilator that lowers BP","A platelet clotting factor","A heart hormone that lowers volume"],"Released in response to low blood flow."],
["Nitric oxide (NO) is released in response to high flow and:","Causes vasodilation, lowering BP",["Causes vasoconstriction","Raises blood volume","Blocks ACh"],"NO = relax."],
["Thromboxane A is made by platelets and causes:","Vasoconstriction, raising BP",["Vasodilation, lowering BP","Sodium excretion","Bradycardia"],"Response to vessel damage."],
["Prostaglandin's effect on BP is to:","Lower it via vasodilation",["Raise it via vasoconstriction","Raise blood volume","Increase viscosity"],"Also helps keep a clot localized."],
["ANF (atrial natriuretic factor) is produced by the:","Atria of the heart",["Adrenal cortex","Kidneys","Posterior pituitary"],"Heart hormone."],
["ANF lowers BP by:","Promoting Na⁺ and water excretion",["Increasing Na⁺ reabsorption","Releasing ADH","Constricting arterioles"],"Opposes aldosterone and ADH."],
["Which pair both LOWER blood pressure?","NO and ANF",["Endothelin and thromboxane","ADH and angiotensin","Epinephrine and thyroxine"],"Vasodilators and fluid dumpers."],
["Dizziness and low BP when standing up quickly is:","Orthostatic hypotension",["Chronic hypotension","Acute hypotension","Secondary hypertension"],"Temporary."],
["Chronic hypotension can be a warning sign of:","Addison's disease",["Graves' disease","Type II diabetes","Parkinson's disease"],"Also poor nutrition."],
["Acute hypotension is an important sign of:","Circulatory shock",["Hypertension","Hyperthyroidism","Exercise"],"A threat in surgery and the ICU."],
["Hypertension with no single identifiable cause is called:","Primary (essential)",["Secondary","Orthostatic","Acute"],"Risk factors: diet, obesity, age, heredity, stress, smoking."],
["Hypertension caused by excess renin secretion or an endocrine disorder is:","Secondary",["Primary","Essential","Orthostatic"],"Identifiable cause."]
]}
};

Object.assign(CATS, C);
UNITS.push(
  {"name":"Heart","deck":"Obj 43–47 · Cardiovascular system and the cardiac cycle","cats":["blood","cycle","ekg"],"tab":"heart"},

);

  ["Lub = AV close, dup = SL close","S1 starts ventricular systole. S2 starts ventricular diastole."],

</script>
<script>
(function(){
const KEY = "bio2301-unit2-v1";
const ALL_IDS = [];
const BYID = {};
Object.entries(CATS).forEach(([cid, c]) => {
  c.q.forEach((x, i) => {
    const id = cid + "-" + i;
    const item = { id, cat: cid, q: x[0], a: x[1], d: x[2], e: x[3], n: !!x[4] };
    BYID[id] = item; ALL_IDS.push(id);
  });
  c.ids = c.q.map((_, i) => cid + "-" + i);
});
Object.entries(CATS).forEach(([cid, c]) => {
  if (!c.refs) return;
  const extra = c.refs.filter(r => BYID[r]).map(r => {
    const id = cid + "~" + r;
    BYID[id] = Object.assign({}, BYID[r], { id, cat: cid, src: r });
    ALL_IDS.push(id); return id;
  });
  c.ids = extra.concat(c.ids);
});

let store = { cats: {} };
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.cats) store = s; } catch(e){} }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
function cs(cid){ if (!store.cats[cid]) store.cats[cid] = { best: null, last: null, missed: [] }; return store.cats[cid]; }
load();
const TABS = ["brain", "muscle", "perform", "motor", "endo", "heart", "all"];
const SECT = TABS.filter(t => t !== "all");
const TLAB = { brain: "Brain", muscle: "Muscle", perform: "Performance", motor: "Motor", endo: "Endocrine", heart: "Heart & BP", all: "Full Exam 2" };
const TDESC = {
  brain: "Sleep and EEG, memory, language and the hemispheres",
  muscle: "Muscle organization, the sarcomere, sliding filaments, the NMJ and E-C coupling",
  perform: "Motor units, twitch and tetanus, energy systems and oxygen debt, fiber types",
  motor: "Motor cortex and tracts, basal nuclei vs cerebellum, the Romberg test, cranial motor nerves",
  endo: "Glands, hormone signaling, the hypothalamus and pituitary, every gland's hormones, diabetes",
  heart: "Blood and heart anatomy, the cardiac cycle, conduction and EKG, cardiac output and blood pressure",
  all: "Every Unit 2 section in one place. Use Full exam here for a real dress rehearsal"
};
let tab = TABS.includes(store.tab) ? store.tab : "brain";
function tabUnits(t){ t = t || tab; return t === "all" ? UNITS : UNITS.filter(u => u.tab === t); }
function tabCats(t){ return tabUnits(t).flatMap(u => u.cats); }
function tabIds(t){ return tabCats(t).flatMap(c => CATS[c].ids); }

const app = document.getElementById("app");
const selected = new Set();
let session = null;
let view = "hub";
let studyScope = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function allMissed(){ return tabCats().flatMap(c => cs(c).missed); }
function tone(p){ return p == null ? "var(--line)" : p >= 100 ? "var(--k)" : p >= 90 ? "var(--good)" : p >= 70 ? "var(--na)" : "var(--bad)"; }

function ring(p){
  const r = 22, C = 2 * Math.PI * r, v = p == null ? 0 : p;
  return `<svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="bgc" cx="27" cy="27" r="${r}"></circle>
  <circle cx="27" cy="27" r="${r}" stroke="${tone(p)}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v / 100)}" stroke-linecap="round" transform="rotate(-90 27 27)"></circle>
  <text x="27" y="31.5" text-anchor="middle">${p == null ? "—" : p + "%"}</text></svg>`;
}

/* ---------- HUB ---------- */
const TRACE = `<svg class="trace" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-label="EKG trace with P, QRS and T waves">
  <line class="ax" x1="0" y1="112" x2="1000" y2="112"></line>
  <text x="66" y="92">P</text><text x="124" y="12">R</text><text x="104" y="146">Q</text><text x="134" y="146">S</text><text x="196" y="74">T</text>
  <path class="ln" d="M0 112 L40 112 C50 112 54 98 64 98 C74 98 78 112 88 112 L106 112 L112 122 L122 14 L132 132 L138 112 L162 112 C176 112 182 80 200 80 C218 80 224 112 240 112 L360 112 C370 112 374 98 384 98 C394 98 398 112 408 112 L426 112 L432 122 L442 14 L452 132 L458 112 L482 112 C496 112 502 80 520 80 C538 80 544 112 560 112 L680 112 C690 112 694 98 704 98 C714 98 718 112 728 112 L746 112 L752 122 L762 14 L772 132 L778 112 L802 112 C816 112 822 80 840 80 C858 80 864 112 880 112 L1000 112"></path>
</svg>`;

function renderHub(){
  view = "hub";
  const cats = tabCats();
  const IDS = tabIds();
  const isLab = tab === "lab";
  const isCT = tab === "crunch";
  const bests = cats.map(c => cs(c).best).filter(v => v != null);
  const overall = bests.length ? Math.round(bests.reduce((a, b) => a + b, 0) / cats.length) : 0;
  const cleared = cats.filter(c => cs(c).best === 100).length;
  const missed = allMissed().length;
  const noteIds = IDS.filter(id => BYID[id].n);

  const tabBtn = (t, label) => `<button class="tab ${tab === t ? "on" : ""}" data-act="tab" data-tab="${t}" aria-pressed="${tab === t}">${label}<span class="ct">${tabIds(t).length}</span></button>`;
  const W_ = W[tab] || SECT.flatMap(t => (W[t] || []).slice(0, 1));
  let h = `<header class="mast">
    <div class="eyebrow">BIO 2301 · Human Physiology · Unit Exam 2 · Fri Oct 30</div>
    <h1>Unit 2 <span>Hub</span></h1>
    <p>${TDESC[tab]}. ${IDS.length} questions in ${cats.length} sections, each with a Primer. Answers shuffle every run.</p>
    ${TRACE}
  </header>
  <nav class="tabs" aria-label="Topic">${TABS.map(t => tabBtn(t, TLAB[t])).join("")}</nav>
  <div class="strip">
    <div class="stat"><b class="mono">${overall}%</b><small>Overall mastery</small></div>
    <div class="stat"><b class="mono">${cleared}/${cats.length}</b><small>Sections at 100%</small></div>
    <div class="stat"><b class="mono">${missed}</b><small>In missed bucket</small></div>
    <div class="stat"><b class="mono">${IDS.length}</b><small>Total questions</small></div>
  </div>
  <div class="actions">
    <button class="btn primary" data-act="all-practice">Practice everything <span class="ct">${IDS.length}</span></button>
    <button class="btn" data-act="all-exam">Full exam <span class="ct">${IDS.length}</span></button>
    <button class="btn na" data-act="all-missed" ${missed ? "" : "disabled"}>Drill all missed <span class="ct">${missed}</span></button>
    <button class="btn ghost" data-act="study-all">Study sheet</button>
    <button class="btn ghost danger" data-act="reset-all" id="reset-all">Reset ${tab === "all" ? "everything" : "this tab"}</button>
  </div>
  <div class="actions">
    <button class="btn" data-act="copy-missed">Copy all missed <span class="ct">${totalMissedAll()}</span></button>
    <button class="btn ghost" data-act="transfer">Export / import progress</button>
  </div>
  <details class="watch"><summary>${tab === "all" ? "Top watch-outs from every tab" : "Watch-outs for " + TLAB[tab]}</summary><ul>
    ${W_.map(w => `<li><b>${esc(w[0])}</b><span>${esc(w[1])}</span></li>`).join("")}
  </ul></details>`;

  tabUnits().forEach(u => {
    const n = u.cats.reduce((a, c) => a + CATS[c].ids.length, 0);
    h += `<section class="unit"><div class="unit-h"><h2>${esc(u.name)}</h2><span class="eyebrow">${esc(u.deck)} · ${n} Qs</span></div><div class="grid">`;
    u.cats.forEach(cid => {
      const c = CATS[cid], s = cs(cid), m = s.missed.length;
      const nn = c.ids.filter(id => BYID[id].n).length;
      h += `<article class="card ${selected.has(cid) ? "sel" : ""}">
        <div class="card-top">${ring(s.best)}
          <div><h3>${esc(c.name)}</h3>
            <div class="meta">${c.ids.length} Qs · best ${s.best == null ? "—" : s.best + "%"} · last ${s.last == null ? "—" : s.last + "%"}</div>
          </div>
          <label class="pick" title="Add to a custom mix"><input type="checkbox" id="pick-${cid}" data-pick="${cid}" ${selected.has(cid) ? "checked" : ""} aria-label="Add ${esc(c.name)} to mix"></label>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${m ? `<span class="chip bad">${m} missed</span>` : s.best === 100 ? `<span class="chip good">Cleared</span>` : ""}
          ${nn ? `<span class="chip na">${nn} from notes</span>` : ""}
        </div>
        <div class="card-btns">
          ${c.primer ? `<button class="btn na" data-act="cat-primer" data-cat="${cid}">Primer</button>` : ""}
          <button class="btn primary" data-act="cat-practice" data-cat="${cid}">Practice</button>
          <button class="btn" data-act="cat-exam" data-cat="${cid}">Exam</button>
          <button class="btn" data-act="cat-study" data-cat="${cid}">Study</button>
          ${m ? `<button class="btn na" data-act="cat-missed" data-cat="${cid}">Missed ${m}</button>` : ""}
          <button class="btn ghost danger" data-act="cat-reset" data-cat="${cid}">Reset</button>
        </div>
      </article>`;
    });
    h += `</div></section>`;
  });

  if (selected.size){
    const n = [...selected].reduce((a, c) => a + CATS[c].ids.length, 0);
    h += `<div class="selbar"><div class="in"><span class="lbl">${selected.size} section${selected.size > 1 ? "s" : ""} · ${n} Qs</span>
      <button class="btn primary" data-act="mix-practice">Practice mix</button>
      <button class="btn" data-act="mix-exam">Exam mix</button>
      <button class="btn ghost" data-act="mix-clear">Clear</button></div></div>`;
  }
  app.innerHTML = h;
}

/* ---------- SESSION ---------- */
function start(mode, ids, title, fullCats){
  if (!ids.length) return;
  session = {
    mode, title, fullCats: fullCats || [],
    items: shuffle(ids).map(id => {
      const b = BYID[id];
      const opts = shuffle([b.a, ...b.d]);
      return { id, opts, correct: opts.indexOf(b.a) };
    }),
    i: 0, picks: [], locked: false
  };
  view = "quiz"; renderQuiz(); window.scrollTo(0, 0);
}

function renderQuiz(){
  const s = session, it = s.items[s.i], b = BYID[it.id];
  const pick = s.picks[s.i];
  const answered = s.mode === "practice" && pick != null;
  const done = s.picks.filter(p => p != null).length;
  const right = s.items.reduce((a, x, i) => a + (s.picks[i] === x.correct ? 1 : 0), 0);
  const pct = Math.round((s.i) / s.items.length * 100);

  let opts = it.opts.map((o, k) => {
    let cls = "opt";
    if (s.mode === "practice" && answered){
      if (k === it.correct) cls += " right"; else if (k === pick) cls += " wrong";
    } else if (pick === k) cls += " chosen";
    return `<button class="${cls}" data-opt="${k}" ${answered ? "disabled" : ""}><span class="key">${k + 1}</span><span>${esc(o)}</span></button>`;
  }).join("");

  let fb = "";
  if (answered){
    const ok = pick === it.correct;
    fb = `<div class="fb ${ok ? "good" : "bad"}"><b>${ok ? "Correct." : "Not quite. Answer: " + esc(b.a)}</b>${esc(b.e)}</div>`;
  }
  const last = s.i === s.items.length - 1;
  const canNext = pick != null;

  app.innerHTML = `<div class="qtop">
      <div class="ttl">${esc(s.title)}</div>
      <span class="chip">${s.mode === "practice" ? "Practice" : "Exam"}</span>
      ${s.mode === "practice" ? `<span class="chip good mono">${right}/${done} right</span>` : ""}
      <button class="btn ghost" data-act="quit">Quit</button>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="eyebrow">Q ${s.i + 1} of ${s.items.length}</span><span class="chip">${esc(CATS[b.cat].name)}</span>${b.n ? `<span class="chip na">From your notes</span>` : ""}${b.src ? `<span class="chip bad">Your miss</span>` : CATS[b.cat].crunch ? `<span class="chip">New angle</span>` : ""}</div>
      <p class="qtext">${esc(b.q)}</p>
      <div class="opts">${opts}</div>
      ${fb}
      <div class="qnav"><span class="hint">Keys 1–4 to answer · Enter for next</span>
        <button class="btn primary" data-act="next" ${canNext ? "" : "disabled"}>${last ? "Finish" : "Next"}</button></div>
    </div>`;
}

function choose(k){
  const s = session; if (!s) return;
  if (s.mode === "practice" && s.picks[s.i] != null) return;
  s.picks[s.i] = k;
  if (s.mode === "practice") track(s.items[s.i], k);
  renderQuiz();
}

function track(it, k){
  const b = BYID[it.id], c = cs(b.cat);
  const idx = c.missed.indexOf(it.id);
  if (k === it.correct){ if (idx > -1) c.missed.splice(idx, 1); }
  else if (idx === -1) c.missed.push(it.id);
  store.picks = store.picks || {};
  if (k === it.correct) delete store.picks[it.id]; else store.picks[it.id] = it.opts[k];
  save();
}

function next(){
  const s = session; if (!s || s.picks[s.i] == null) return;
  if (s.i < s.items.length - 1){ s.i++; renderQuiz(); window.scrollTo(0, 0); }
  else finish();
}

function finish(){
  const s = session;
  if (s.mode === "exam") s.items.forEach((it, i) => track(it, s.picks[i]));
  const per = {};
  s.items.forEach((it, i) => {
    const cat = BYID[it.id].cat; per[cat] = per[cat] || { r: 0, t: 0 };
    per[cat].t++; if (s.picks[i] === it.correct) per[cat].r++;
  });
  s.fullCats.forEach(cat => {
    if (!per[cat]) return;
    const p = Math.round(per[cat].r / per[cat].t * 100), c = cs(cat);
    c.last = p; c.best = c.best == null ? p : Math.max(c.best, p);
  });
  save();
  s.per = per; view = "results"; renderResults(); window.scrollTo(0, 0);
}

function renderResults(){
  const s = session;
  const right = s.items.filter((it, i) => s.picks[i] === it.correct).length;
  const pct = Math.round(right / s.items.length * 100);
  const misses = s.items.map((it, i) => ({ it, pick: s.picks[i] })).filter(x => x.pick !== x.it.correct);
  const verdict = pct === 100 ? "Clean sweep. That section is locked in." : pct >= 90 ? "Close. Clean up the misses and run it again." : pct >= 70 ? "Getting there. Drill the misses, then rerun." : "Rough run. Hit Study first, then drill.";
  const cats = Object.keys(s.per);
  let h = `<div class="res">
    <div class="qtop"><div class="ttl">${esc(s.title)}</div><span class="chip">${s.mode === "practice" ? "Practice" : "Exam"} results</span></div>
    <div class="score"><div class="big mono" style="color:${tone(pct)}">${pct}%</div>
      <div><h2>${right} of ${s.items.length} correct</h2><p>${verdict}</p>
      ${s.fullCats.length ? "" : `<p class="eyebrow" style="margin-top:6px">Drill runs don't change section scores</p>`}</div></div>
    <div class="actions">
      ${misses.length ? `<button class="btn na" data-act="retry-miss">Drill these ${misses.length} misses</button>` : ""}
      <button class="btn primary" data-act="again">Run it again</button>
      <button class="btn" data-act="home">Back to hub</button>
    </div>`;
  if (cats.length > 1){
    h += `<h3 class="sech">By section</h3><div class="breakdown">` + cats.map(c => {
      const p = Math.round(s.per[c].r / s.per[c].t * 100);
      return `<div class="brow"><span>${esc(CATS[c].name)}</span><span class="mono" style="color:${tone(p)}">${s.per[c].r}/${s.per[c].t} · ${p}%</span></div>`;
    }).join("") + `</div>`;
  }
  if (misses.length){
    h += `<h3 class="sech">What you missed</h3>` + misses.map(({ it, pick }) => {
      const b = BYID[it.id];
      return `<div class="miss"><p>${esc(b.q)}</p>
        <div class="yours">You: ${esc(it.opts[pick])}</div>
        <div class="corr">Answer: ${esc(b.a)}</div>
        <small>${esc(b.e)}</small></div>`;
    }).join("");
  }
  h += `</div>`;
  app.innerHTML = h;
  session.missIds = misses.map(x => x.it.id);
}

/* ---------- STUDY ---------- */
function renderStudy(catIds, q){
  view = "study"; studyScope = catIds;
  const term = (q || "").trim().toLowerCase();
  let body = "";
  catIds.forEach(cid => {
    const rows = CATS[cid].ids.map(id => BYID[id]).filter(b => !term || (b.q + " " + b.a + " " + b.e).toLowerCase().includes(term));
    if (!rows.length) return;
    body += `<h3 class="sech">${esc(CATS[cid].name)}</h3>` + rows.map(b => `<div class="sq"><p>${esc(b.q)}${b.n ? ` <span class="chip na">notes</span>` : ""}</p><div class="a">${esc(b.a)}</div><small>${esc(b.e)}</small></div>`).join("");
  });
  const title = catIds.length === 1 ? CATS[catIds[0]].name : "Study sheet";
  const results = body || `<p class="empty">Nothing matches "${esc(q)}".</p>`;
  if (document.getElementById("study-body")){ document.getElementById("study-body").innerHTML = results; return; }
  app.innerHTML = `<div class="study">
    <div class="qtop"><div class="ttl">${esc(title)}</div>
      ${catIds.length === 1 ? `<button class="btn primary" data-act="cat-practice" data-cat="${catIds[0]}">Practice this</button>` : ""}
      <button class="btn ghost" data-act="home">Back to hub</button></div>
    <input class="search" id="study-search" type="search" placeholder="Search questions, answers, explanations" autocomplete="off">
    <div id="study-body">${results}</div></div>`;
  window.scrollTo(0, 0);
}

/* ---------- CRUNCH TIME VIEWS ---------- */
function renderPrimer(cid){
  view = "primer";
  const c = CATS[cid];
  const html = typeof c.primer === "function" ? c.primer() : c.primer;
  app.innerHTML = `<div class="study primer">
    <div class="qtop"><div class="ttl">${esc(c.name)}: primer</div>
      <button class="btn primary" data-act="cat-practice" data-cat="${cid}">Practice this</button>
      <button class="btn ghost" data-act="home">Back to hub</button></div>
    ${html}
    <div class="actions" style="margin-top:20px"><button class="btn primary" data-act="cat-practice" data-cat="${cid}">Got it. Practice</button><button class="btn ghost" data-act="home">Back to hub</button></div></div>`;
  window.scrollTo(0, 0);
}
function showKey(b){
  const g = b.dataset.g, k = b.dataset.k;
  document.querySelectorAll(`[data-g="${g}"]`).forEach(el => {
    if (el.dataset.act === "show") el.classList.toggle("on", el.dataset.k === k);
    else if (el.dataset.k === k) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
  });
}
function totalMissedAll(){ return SECT.reduce((a, t) => a + tabCats(t).reduce((x, c) => x + cs(c).missed.length, 0), 0); }
function missedText(){
  const out = [], picks = store.picks || {}; let n = 0;
  SECT.map(t => [t, TLAB[t].toUpperCase()]).forEach(([t, label]) => {
    const lines = [];
    tabCats(t).forEach(cid => {
      const m = cs(cid).missed.filter(id => BYID[id]); if (!m.length) return;
      lines.push(`## ${CATS[cid].name} (${m.length} missed)`);
      m.forEach(id => { const b = BYID[id]; n++; lines.push(`- [${id}] ${b.q}\n  You picked: ${picks[id] || "not recorded"}\n  Answer: ${b.a}`); });
    });
    if (lines.length) out.push(`=== ${label} ===\n` + lines.join("\n"));
  });
  return { text: out.join("\n\n"), n };
}
function copyMissed(){
  const { text, n } = missedText();
  if (!n){ toast("Nothing missed. Suspicious, but nice."); return; }
  copyText(`BIO 2301 Unit 2 misses (${n})\n\n` + text, `Copied ${n} misses`);
}
function copyText(t, msg){
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); ok ? toast(msg) : showManual(t);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => toast(msg), fallback);
  else fallback();
}
function showManual(t){
  view = "transfer";
  app.innerHTML = `<div class="study"><div class="qtop"><div class="ttl">Copy this</div><button class="btn ghost" data-act="home">Back to hub</button></div>
    <p>This browser blocked automatic copying. Click in the box, select all, and copy.</p><textarea class="box" readonly style="min-height:320px">${esc(t)}</textarea></div>`;
}
function toast(m){
  let el = document.getElementById("toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = m; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200);
}
function renderTransfer(){
  view = "transfer";
  const exp = JSON.stringify({ [KEY]: JSON.stringify(store) });
  app.innerHTML = `<div class="study"><div class="qtop"><div class="ttl">Export / import</div><button class="btn ghost" data-act="home">Back to hub</button></div>
    <section class="pr"><h3>Export from this computer</h3><p>Copy this, then email or text it to yourself.</p>
      <textarea class="box" id="exp-box" readonly>${esc(exp)}</textarea>
      <div class="actions"><button class="btn primary" data-act="do-export-copy">Copy progress</button></div></section>
    <section class="pr"><h3>Import on this computer</h3><p>Paste an export from this Unit 2 hub. It replaces the scores saved here.</p>
      <textarea class="box" id="imp-box" placeholder="Paste here"></textarea>
      <div class="actions"><button class="btn primary" data-act="do-import">Import progress</button></div>
      <p class="hint2" id="imp-msg"></p></section></div>`;
  window.scrollTo(0, 0);
}
function doImport(){
  const raw = (document.getElementById("imp-box").value || "").trim();
  try {
    let o = JSON.parse(raw);
    if (o && o[KEY] !== undefined) o = typeof o[KEY] === "string" ? JSON.parse(o[KEY]) : o[KEY];
    if (!o || typeof o.cats !== "object") throw 0;
    store = o; if (!TABS.includes(store.tab)) store.tab = "brain";
    tab = store.tab; save(); selected.clear(); renderHub(); window.scrollTo(0, 0); toast("Progress imported");
  } catch(e){
    document.getElementById("imp-msg").textContent = "That doesn't look like a hub export. Paste the whole thing, brackets and all.";
  }
}

/* ---------- EVENTS ---------- */
const armed = {};
function arm(btn, key, run){
  if (armed[key]){ clearTimeout(armed[key]); delete armed[key]; run(); return; }
  btn.classList.add("armed"); btn.textContent = "Tap again to reset";
  armed[key] = setTimeout(() => { delete armed[key]; if (view === "hub") renderHub(); }, 3000);
}

app.addEventListener("click", e => {
  const o = e.target.closest("[data-opt]"); if (o){ choose(+o.dataset.opt); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, cid = b.dataset.cat;
  const cats = tabCats();
  const IDS = tabIds();
  switch (act){
    case "tab": tab = TABS.includes(b.dataset.tab) ? b.dataset.tab : "brain"; store.tab = tab; save(); selected.clear(); renderHub(); break;
    case "all-practice": start("practice", IDS, TLAB[tab] + ": everything", cats); break;
    case "all-exam": start("exam", IDS, tab === "all" ? "Full Exam 2" : TLAB[tab] + " exam", cats); break;
    case "all-missed": start("practice", allMissed(), "All missed"); break;
    case "notes": start("practice", IDS.filter(id => BYID[id].n), "From my notes"); break;
    case "study-all": renderStudy(cats); break;
    case "reset-all": arm(b, "all", () => { cats.forEach(c => { store.cats[c] = { best: null, last: null, missed: [] }; }); save(); selected.clear(); renderHub(); }); break;
    case "cat-practice": start("practice", CATS[cid].ids, CATS[cid].name, [cid]); break;
    case "cat-exam": start("exam", CATS[cid].ids, CATS[cid].name, [cid]); break;
    case "cat-study": renderStudy([cid]); break;
    case "cat-missed": start("practice", cs(cid).missed, CATS[cid].name + ": missed"); break;
    case "cat-reset": arm(b, cid, () => { store.cats[cid] = { best: null, last: null, missed: [] }; save(); renderHub(); }); break;
    case "mix-practice": case "mix-exam": {
      const list = cats.filter(c => selected.has(c));
      start(act === "mix-practice" ? "practice" : "exam", list.flatMap(c => CATS[c].ids), "Custom mix", list); break;
    }
    case "mix-clear": selected.clear(); renderHub(); break;
    case "cat-primer": renderPrimer(cid); break;
    case "show": showKey(b); break;
    case "copy-missed": copyMissed(); break;
    case "transfer": renderTransfer(); break;
    case "do-export-copy": copyText(document.getElementById("exp-box").value, "Progress copied"); break;
    case "do-import": doImport(); break;
    case "next": next(); break;
    case "quit": session = null; renderHub(); window.scrollTo(0, 0); break;
    case "home": session = null; renderHub(); window.scrollTo(0, 0); break;
    case "again": start(session.mode, session.items.map(x => x.id), session.title, session.fullCats); break;
    case "retry-miss": start("practice", session.missIds, session.title + ": misses"); break;
  }
});

app.addEventListener("change", e => {
  const p = e.target.closest("[data-pick]"); if (!p) return;
  const cid = p.dataset.pick;
  p.checked ? selected.add(cid) : selected.delete(cid);
  const y = window.scrollY; renderHub(); window.scrollTo(0, y);
});

app.addEventListener("input", e => {
  if (e.target.id === "study-search") renderStudy(studyScope, e.target.value);
});

document.addEventListener("keydown", e => {
  if (view !== "quiz" || !session) return;
  if (e.target.tagName === "INPUT") return;
  if (["1","2","3","4"].includes(e.key)) { e.preventDefault(); choose(+e.key - 1); }
  else if (e.key === "Enter") { e.preventDefault(); next(); }
});

renderHub();
})();
</script>
